meta:
  title: Background Stage Switch
  slug: background-stage-switch
mode: stage
theme: xinimalist-paper
background:
  type: css
  gradient:
    type: linear
    angle: 135
    stops:
      - '#f9f5ef'
      - '#efe0d1'
  stages:
    - steps: [1, 1]
      presetRef: focus-grain
    - steps: [2, 2]
      presetRef: focus-grain
      colorStops:
        - '#1b263b'
        - '#415a77'
        - '#e0e1dd'
      intensity: 0.82
      grain: 0.58
  transition:
    duration: 600
    easing: ease-in-out
steps:
  - id: intro
    title: Intro
    layout: single-content
    components:
      - type: headline
        content: Intro
  - id: focus
    title: Focus
    layout: single-content
    components:
      - type: headline
        content: Focus
  - id: detail
    title: Detail
    layout: single-content
    components:
      - type: headline
        content: Detail
