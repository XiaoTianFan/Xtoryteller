$schema: ./schema.json
required:
  meta:
    title: string
    slug: string
  mode: stage | map
optional:
  theme: string
stage:
  requiredWhenModeIsStage:
    steps:
      - layout: string
        components:
          - type: string
            content: string?
            props: object?
            style: object?
            build: number | sequential | object?
            enter: string?
            exit: string?
            position:
              x: number?
              y: number?
              width: number?
              height: number?
map:
  requiredWhenModeIsMap:
    clusters:
      - id: string
        layout: string
        labelPosition: top-left | top-right | bottom-left | bottom-right ?
        frame:
          width: number > 0 ?
          height: number > 0 ?
        anchor:
          x: number?
          y: number?
          relativeTo: string?
          direction: left | right | above | below | upper-right | upper-left | lower-right | lower-left
          distance: number?
        arrangement: deprecated legacy fallback object?
        components:
          - type: string
            props: object?
            position:
              x: number?
              y: number?
              width: number?
              height: number?
    canvas:
      spacing: number?
      arrangement:
        algorithm: flow | radial | grid | tree
        columns: number > 0 ?
        radius: number > 0 ?
        spacing: number > 0 ?
    navigation:
      sequence: string[]?
shared:
  background:
    stringValue: css background string | none | paper shader name
    object:
      type: paper-shader | css | none | legacy paper?
      presetRef: string?
      shader: string?
      preset: string?
      params: object?
      value: string?
      gradient:
        type: linear | radial
        angle: string | number
        position: string?
        stops: string[] (min 2)
      colorStops: string[]?
      intensity: number?
      grain: number?
      contrast: number?
      speed: number?
      opacity: number?
      filter:
        mode: radial | radial-reverse | linear-horizontal | linear-horizontal-reverse | linear-vertical | linear-vertical-reverse
        opacity: number?
        radialSize:
          width: number?
          height: number?
        linearProportion: number?
        steepness: number?
      transition:
        duration: number?
        easing: string?
      stages:
        - steps: [number, number]
          presetRef: string?
          type: paper-shader | css | none | legacy paper?
          filter:
            mode: radial | radial-reverse | linear-horizontal | linear-horizontal-reverse | linear-vertical | linear-vertical-reverse
            opacity: number?
            radialSize:
              width: number?
              height: number?
            linearProportion: number?
            steepness: number?
      regions:
        - clusters: string[]?
          group: string?
          presetRef: string?
          type: paper-shader | css | none | legacy paper?
          filter:
            mode: radial | radial-reverse | linear-horizontal | linear-horizontal-reverse | linear-vertical | linear-vertical-reverse
            opacity: number?
            radialSize:
              width: number?
              height: number?
            linearProportion: number?
            steepness: number?
  backgroundSections:
    - match:
        stepRange: [number, number]?
        clusterIds: string[]?
        group: string?
      shader: string | object
