name: timeline-item
displayName: Timeline Item
description: Event card intended for timeline-layout.
category: content-card
content: true
props:
  date:
    type: string
    required: true
  title:
    type: string
    required: true
  marker:
    type: enum
    values: [dot, icon, number]
    default: dot
  markerValue:
    type: string
    description: Lucide icon name when marker is icon, or literal number text when marker is number.
