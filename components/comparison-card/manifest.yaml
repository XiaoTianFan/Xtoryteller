name: comparison-card
displayName: Comparison Card
description: Two-sided card for tradeoff or before/after framing.
category: content-card
content: true
props:
  title:
    type: string
  leftTitle:
    type: string
    required: true
  leftContent:
    type: string
  leftItems:
    type: array
  rightTitle:
    type: string
    required: true
  rightContent:
    type: string
  rightItems:
    type: array
  variant:
    type: enum
    values: [versus, before-after, neutral]
    default: neutral
