meta:
  title: Recalibrating the Music System
  slug: human-ai-and-music-insight-brief
  description: A long-form stage deck translating the full AI music systems
    research into a rich narrative about breakdown dynamics, leverage points,
    and pluralistic futures.
  author: Xtoryteller
  tags: [ stage, ai, music, systems, policy, insight-brief, long-form ]
  createdAt: '2026-04-02'
  updatedAt: '2026-04-02'
mode: stage
theme: electric-studio
background:
  type: paper-shader
  presetRef: ember-truchet
  filter:
    mode: linear-vertical-reverse
    opacity: 0.66
    linearProportion: 0.72
themeOverrides:
  colors:
    primary: '#ff6b2c'
    secondary: '#18c3b0'
steps:
  - id: opening
    title: Opening
    description: Research framing for the transition from extractive AI music
      systems toward pluralistic futures.
    layout: title-center
    transition: fade
    components:
      - type: label
        content: System insight brief
        props: { tone: primary }
      - type: headline
        content: Recalibrating the Music System
        props: { level: 1, align: center }
        style:
          maxWidth: 9ch
          fontSize: clamp(3.9rem, 6vw, 6.5rem)
          lineHeight: 0.92
      - type: subtitle
        content: |
          Navigating the transition from AI extraction to creative co-evolution
          across royalties, representation, infrastructure, and cultural value.
        props: { align: center }
        style:
          maxWidth: 48rem
          lineHeight: 1.3
      - type: footnote
        content: |
          NYUAD, Xiaotian Fan, Spring 2025.

  - id: section-context
    title: Section I
    description: From the core thesis to the structure and scope of the problem.
    layout: title-left
    transition: slide-up
    components:
      - type: label
        content: Section I
        props: { tone: secondary }
      - type: headline
        content: Context And System Framing
        props: { level: 2 }
      - type: subtitle
        content: The research begins by establishing why AI music is a structural
          transition rather than a narrow product story.

  - id: executive-summary
    title: Executive Summary
    description: The central argument and primary breakdown loops identified by the
      research.
    layout: scattered
    transition: slide-left
    components:
      - type: label
        content: Executive summary
        props: { tone: secondary }
        position:
          x: 0.028892
          y: 0.130215
          width: 0.942215
          height: 0.098704
      - type: body-text
        content: |
          Between 2023 and 2025, generative AI music moved from research
          prototype to consumer product capable of producing radio-ready tracks
          in seconds. That acceleration collided with an already fragile music
          economy built around streaming scarcity, opaque algorithms, and low
          artist bargaining power.
        position:
          x: 0.028892
          y: 0.209782
          width: 0.942215
          height: 0.13427
      - type: body-text
        content: |
          Our research identifies three reinforcing loops driving breakdown: the
          Race to the Bottom, the Homogenization Loop, and the Attention Trap.
          Together they intensify royalty dilution, cultural erasure, and
          platform dependence rather than simply introducing a new tool.
        position:
          x: 0.028892
          y: 0.407564
          width: 0.942215
          height: 0.100702
      - type: body-text
        content: |
          The proposed path forward is not anti-technology nostalgia. It is a
          transition toward a pluralistic ecosystem built around consent-based
          training, provenance labeling, quality-weighted value systems, and
          representational parity.
        position:
          x: 0.028892
          y: 0.571779
          width: 0.942215
          height: 0.100702
      - type: callout
        content: |
          The question is not whether AI enters music. The question is whether
          the resulting system is extractive and homogenizing, or transparent,
          diverse, and regenerative.
        props:
          title: Core thesis
          variant: important
        position:
          x: 0.614366
          y: 0.217049
          width: 0.260835
          height: 0.407225

  - id: issue-urgency
    title: Issue And Urgency
    description: Why rapid AI music adoption collides with already fragile economic,
      cultural, and political conditions.
    layout: grid-3x2
    transition: slide-up
    components:
      - type: stat-card
        props:
          label: AI upload share
          value: 15-20%
          detail: Estimated share of new streaming uploads described as AI-generated by
            early 2025.
      - type: stat-card
        props:
          label: Possible by 2027
          value: 50%
          detail: Projection in our research for how quickly synthetic output could scale
            if current trajectories hold.
      - type: stat-card
        props:
          label: Global North bias
          value: '94.8%'
          detail: Dataset imbalance highlighted as a major risk for cultural erasure and
            poor model performance on non-Western genres.
      - type: feature-card
        content: |
          Platforms such as Suno, Udio, and Stable Audio reduce musical entry
          barriers dramatically, but they also intensify dependence on
          proprietary datasets, compute infrastructure, and opaque distribution systems.
        props:
          eyebrow: Tool shock
          title: Professional output at prompt speed
          icon: chart-column
      - type: feature-card
        content: |
          Streaming economies were designed for scarce, human-speed production.
          Infinite synthetic supply breaks the assumptions behind the pro-rata
          payout model.
        props:
          eyebrow: Economic mismatch
          title: Scarcity logic no longer fits
          icon: route
      - type: feature-card
        content: |
          Governance has lagged behind deployment. Lawsuits, likeness acts, and
          copyright rulings are reacting after infrastructure and habits have already scaled.
        props:
          eyebrow: Political lag
          title: Regulation trails the market
          icon: shield-check

  - id: why-systemic
    title: Why This Is A Complex System Problem
    description: Why the research treats AI music as a wicked systems challenge
      rather than a single-policy problem.
    layout: grid-2x2
    transition: slide-left
    components:
      - type: body-text
        content: |
          Our research rejects a simple problem-solution framing. The AI music
          transition involves many actors with conflicting goals: independent
          musicians need sustainable income and autonomy, platforms seek
          engagement and growth, AI firms pursue speed and market capture,
          listeners seek convenience but still claim to value authenticity, and
          Global South communities confront digital marginalization.

          Actions that appear rational at one level become harmful at another.
          An artist using AI to survive, or a platform optimizing playlists for
          frictionless listening, can worsen the collective conditions of the system.
      - type: bullet-list
        props:
          items:
            - Multiple interacting stakeholders optimize for incompatible
              outcomes.
            - Reinforcing loops create unintended consequences and collective
              lock-in.
            - Delayed effects mean damage appears slowly while capability scales
              quickly.
            - Deep paradigm conflicts sit underneath economics and law.
            - Micro-level platform success can create macro-level cultural
              failure.
      - type: callout
        content: |
          One person's democratization is another person's cultural genocide.
          The conflict is not only about tools. It is also about worldviews.
        props:
          title: Paradigm conflict
          variant: warning

  - id: who-is-affected
    title: Who Is Affected
    description: The groups most directly and indirectly affected by the transition
      in music infrastructure.
    layout: grid-3x2
    transition: slide-up
    components:
      - type: feature-card
        content: |
          Income erosion, identity crisis, and pressure to adopt the same tools
          that may further devalue their work.
        props:
          eyebrow: Primary impact
          title: Independent and mid-tier musicians
          icon: user
      - type: feature-card
        content: |
          Freelance roles in background scores, sync composition, and commercial
          jingles are especially vulnerable to replacement by functional AI output.
        props:
          eyebrow: Primary impact
          title: Session musicians and sync composers
          icon: users
      - type: feature-card
        content: |
          These communities face double marginalization: economic extraction and
          cultural erasure as Western-trained models fail to represent their traditions.
        props:
          eyebrow: Primary impact
          title: Global South artists
          icon: globe
      - type: feature-card
        content: |
          Algorithmic curation increasingly privileges vibe over identity,
          weakening meaningful artist-audience relationships.
        props:
          eyebrow: Secondary impact
          title: Music listeners and fans
          icon: radio
      - type: feature-card
        content: |
          Educators must defend the value of musical training when technically
          proficient output can appear instantly through prompting.
        props:
          eyebrow: Secondary impact
          title: Educators and institutions
          icon: book-open
      - type: feature-card
        content: |
          Future generations inherit a more homogenized musical landscape, while
          climate systems absorb the hidden carbon cost of compute-intensive generation.
        props:
          eyebrow: Tertiary impact
          title: Future publics and planetary systems
          icon: globe

  - id: stakeholder-power
    title: Stakeholder Power Dynamics
    description: How visible market actors and invisible infrastructure actors shape
      the system differently.
    layout: sidebar-main
    transition: slide-right
    components:
      - type: callout
        content: |
          Our research actor map shows a major power shift. Traditional
          industry gatekeepers still matter, but invisible infrastructure actors
          now shape who can build models, what they cost, and whose music becomes legible.
        props:
          title: New system shapers
          variant: important
      - type: stakeholder-map
        props:
          center: AI music system
          rings:
            - label:
              stakeholders:
                - { label: Cloud, angle: 10 }
                - { label: GPU, angle: 95 }
                - { label: DSPs, angle: 190 }
                - { label: Regulators, angle: 285 }
            - label:
              stakeholders:
                - { label: Labels, angle: 35 }
                - { label: Startups, angle: 160 }
                - { label: PROs, angle: 300 }
            - label:
              stakeholders:
                - { label: Artists, angle: 30 }
                - { label: Unions, angle: 150 }
                - { label: Fans, angle: 275 }
            - label:
              stakeholders:
                - { label: Holly+, angle: 60 }
                - { label: MIR, angle: 180 }
                - { label: Bandcamp, angle: 315 }

  - id: major-system-flows
    title: Major System Flows
    description: The economic, information, power, and cultural flows that move
      value and influence through the system.
    layout: grid-2x2
    transition: slide-left
    components:
      - type: feature-card
        content: |
          The fixed royalty pool is diluted as uploads rise. Artist creativity
          also flows into models without compensation, while value concentrates
          upward toward platforms and infrastructure providers.
        props:
          eyebrow: Economic flows
          title: Money moves away from distributed creators
          icon: chart-column
          items:
            - Royalty pool dilution
            - Training data extraction
            - Compute rent
            - Wealth concentration
      - type: feature-card
        content: |
          Platforms control discovery, artists lack visibility into training
          datasets, and there is no universal standard for labeling generation method.
        props:
          eyebrow: Information flows
          title: Opacity shapes the market
          icon: search
          items:
            - Algorithmic curation
            - Metadata gaps
            - Training data opacity
      - type: feature-card
        content: |
          Tech companies lobby for permissive interpretations while labels lobby
          for restriction. Once listener habits settle around AI-generated playlists,
          reversal becomes economically painful.
        props:
          eyebrow: Power flows
          title: Lock-in follows influence
          icon: shield-check
          items:
            - Legislative capture
            - Technological lock-in
            - Infrastructure dependency
      - type: feature-card
        content: |
          Western epistemologies embedded in data collection and model design
          shape what counts as music globally, while authenticity becomes more
          symbolic than actionable.
        props:
          eyebrow: Cultural flows
          title: Meaning is being reformatted
          icon: globe
          items:
            - Homogenization pressure
            - Authenticity paradox
            - Identity erosion

  - id: system-boundaries
    title: System Boundaries And Limits
    description: What the research includes, what it acknowledges, and what it
      deliberately leaves outside scope.
    layout: three-column
    transition: slide-up
    components:
      - type: feature-card
        content: |
          The research focuses on AI music generation for consumer and
          commercial use, platform governance, royalty systems, and cultural representation.
        props:
          eyebrow: In scope
          title: Core field of inquiry
          items:
            - Streaming and sync licensing
            - Professional and semi-professional musicians
            - Training data diversity
            - Platform governance
      - type: feature-card
        content: |
          Several adjacent areas matter but are not central here, including AI
          production tools, broader creative AI debates, and philosophical copyright theory.
        props:
          eyebrow: Adjacent
          title: Acknowledged but not centered
          items:
            - Mixing and mastering aids
            - Visual art and writing parallels
            - Legal theory
            - Neuroscience of perception
      - type: feature-card
        content: |
          The research intentionally does not dive into model architecture details,
          company strategy, or music theory aesthetics. The emphasis is systemic structure.
        props:
          eyebrow: Out of scope
          title: Deliberate exclusions
          items:
            - Model internals
            - Firm-by-firm strategy
            - Aesthetic criticism

  - id: section-methods
    title: Section II
    description: The research methods and the diagnostic lenses used to interpret
      the system.
    layout: title-left
    transition: slide-up
    components:
      - type: label
        content: Section II
        props: { tone: secondary }
      - type: headline
        content: Research Design And Diagnosis
        props: { level: 2 }
      - type: subtitle
        content: Interviews, systems mapping, and transition modeling turn scattered
          signals into an interpretable structure.

  - id: methods-used
    title: Methods Used
    description: The interview, mapping, and secondary-analysis methods that
      underpin the findings.
    layout: grid-2x2
    transition: slide-left
    components:
      - type: feature-card
        content: |
          Nine semi-structured interviews were conducted across three groups:
          listeners, musicians and producers, and MIR researchers.
        props:
          eyebrow: Method 1
          title: Multi-stakeholder interviews
          icon: users
          items:
            - Audience n=3
            - Musicians n=3
            - MIR researchers n=4
      - type: feature-card
        content: |
          Causal loop analysis traced how technological capability, economic
          incentives, and cultural shifts reinforce one another.
        props:
          eyebrow: Method 2
          title: System mapping
          icon: route
          items:
            - Reinforcing loops
            - Balancing loops
            - Actor interactions
      - type: feature-card
        content: |
          Secondary research included bibliometric analysis, dataset audits, and
          technical reviews of representation and tokenization choices.
        props:
          eyebrow: Method 3
          title: Secondary analysis
          icon: book-open
          items:
            - 25 years of MIR publications
            - 94.8% Global North representation
            - Architecture and data critiques
      - type: feature-card
        content: |
          The Three Horizons framework connected the current regime, transitional
          innovations, and emerging desirable futures already visible in pockets.
        props:
          eyebrow: Method 4
          title: Transition scenario modeling
          icon: chart-column
          items:
            - Declining regime
            - Bridge mechanisms
            - Emerging future

  - id: fixes-that-backfire
    title: Pattern 1 - Fixes That Backfire
    description: How rational short-term adaptation intensifies long-term instability.
    layout: media-left-content-right
    transition: slide-left
    components:
      - type: cycle-diagram
        props:
          stages:
            - { label: Adopt AI, icon: route }
            - { label: More uploads, icon: chart-column }
            - { label: Lower payout, icon: arrow-down }
            - { label: More pressure, icon: triangle-alert }
      - type: body-text
        content: |
          Musicians adopt AI to increase productivity and remain competitive.
          That is a rational short-term fix under pressure. But when the same
          behavior scales across the ecosystem, it contributes to saturation,
          lower payouts, and even greater pressure to adopt automation.
      - type: bullet-list
        props:
          items:
            - Individual rationality produces collective irrationality.
            - Market saturation becomes a feedback loop, not a one-time event.
            - The system rewards the very behavior that weakens livelihoods.
      - type: callout
        content: |
          The tension is cognitive as well as economic: musicians often
          experience AI as both liberation and existential threat at once.
        props:
          title: Key tension
          variant: warning

  - id: success-to-successful
    title: Pattern 2 - Success To The Successful
    description: How dataset advantage compounds into representational dominance.
    layout: media-left-content-right
    transition: slide-left
    components:
      - type: cycle-diagram
        props:
          stages:
            - { label: Western data, icon: database }
            - { label: Better fit, icon: chart-column }
            - { label: More usage, icon: users }
            - { label: More data, icon: refresh-cw }
      - type: body-text
        content: |
          Western music's historical digitization advantage makes models perform
          better on Western genres. Better performance drives more adoption, which
          creates more Western data and deepens the bias. Meanwhile, poor model
          performance on non-Western traditions discourages adoption and leaves
          those traditions even less represented.
      - type: bullet-list
        props:
          items:
            - Bias is reproduced through performance incentives, not just bad
              intent.
            - Underrepresentation compounds over time.
            - Democratization rhetoric can hide digital colonialism.
      - type: callout
        content: |
          A system that learns mainly from the Global North does not simply
          reflect the world. It exports one musical worldview as the default.
        props:
          title: Cultural risk
          variant: important

  - id: shifting-the-burden
    title: Pattern 3 - Shifting The Burden
    description: How symptomatic survival strategies erode deeper cultural capacity.
    layout: media-left-content-right
    transition: slide-left
    components:
      - type: cycle-diagram
        props:
          stages:
            - { label: Income strain, icon: triangle-alert }
            - { label: AI substitute, icon: route }
            - { label: Less skill, icon: arrow-down }
            - { label: Culture erodes, icon: globe }
      - type: body-text
        content: |
          As human-made music becomes less economically sustainable, musicians
          may shift toward AI generation as a symptomatic solution. That move
          reduces incentives to invest in deep craft, mentorship, and
          intergenerational transmission, weakening the very cultural capacity
          needed for long-term resilience.
      - type: bullet-list
        props:
          items:
            - Short-term survival can undermine long-term cultural continuity.
            - Craft erosion is slower and less visible than platform growth.
            - Some losses only become visible after lock-in has occurred.
      - type: callout
        content: |
          The question is not only how many songs can be produced. It is whether
          the ecosystem keeps producing musicians, mentors, and traditions.
        props:
          title: Deeper issue
          variant: note

  - id: tragedy-of-the-commons
    title: Pattern 4 - Tragedy Of The Commons
    description: How the shared royalty pool is overgrazed by individually rational
      behavior.
    layout: comparison-layout
    transition: wipe-left
    components:
      - type: comparison-card
        content: |
          The royalty pool behaves like a commons: each actor is rewarded for
          maximizing uploads, but the shared resource deteriorates as everyone does so.
        props:
          title: Individual incentive
          leftTitle: Rational move
          leftItems:
            - Upload more music
            - Use AI to cut production time
            - Chase algorithmic relevance
          rightTitle: Collective effect
          rightItems:
            - Pool dilution
            - Falling per-stream value
            - More pressure on everyone else
          variant: versus
      - type: comparison-card
        content: |
          Without redesigning access rules, quality thresholds, or payout logic,
          self-interest guarantees degradation rather than equilibrium.
        props:
          title: Structural contradiction
          leftTitle: Platform logic
          leftItems:
            - Abundance drives engagement
            - More choice is treated as success
          rightTitle: Artist logic
          rightItems:
            - Scarcity creates value
            - Exclusivity supports livelihoods
          variant: neutral
      - type: callout
        content: |
          The same system cannot simultaneously optimize for infinite abundance
          and scarcity-based compensation without eventually breaking.
        props:
          title: Why redesign is unavoidable
          variant: warning

  - id: roots-vs-symptoms
    title: Root Causes Versus Visible Symptoms
    description: The difference between what audiences notice first and what
      actually drives the system.
    layout: comparison-layout
    transition: slide-left
    components:
      - type: comparison-card
        content: |
          What appears at the litany level is only the visible edge of the problem.
        props:
          title: Visible symptoms
          leftTitle: Surface events
          leftItems:
            - "$0.003 per stream type payouts"
            - AI tracks displacing playlist slots
            - Listeners not distinguishing origin
            - Artists feeling irrelevant
          rightTitle: What those symptoms point to
          rightItems:
            - Structural mismatch in royalty design
            - Engagement-first curation
            - Music reframed as utility
            - Scarcity myth breaking down
          variant: before-after
      - type: comparison-card
        content: |
          The research stresses that symptom relief without structural and
          worldview change produces only temporary improvement.
        props:
          title: Deeper root causes
          leftTitle: Structural roots
          leftItems:
            - Pro-rata model plus zero-marginal-cost production
            - Western epistemology in data choices
            - Copyright designed for reproduction, not learning
          rightTitle: Worldview and myth roots
          rightItems:
            - Authenticity valued in principle, traded away in practice
            - Functional value prioritized over narrative value
            - Scarcity equated with artistic worth
          variant: neutral

  - id: surprising-contradictions
    title: Surprising Contradictions
    description: Emergent tensions uncovered by the research that complicate simple
      solutions.
    layout: grid-2x2
    transition: slide-up
    components:
      - type: feature-card
        content: |
          People say human origin matters, yet actual behavior often privileges
          convenience, vibe, and low-friction discovery.
        props:
          eyebrow: Contradiction 1
          title: The authenticity paradox
          icon: user
          items:
            - Values and behavior diverge
            - Labels must lower transaction costs
      - type: feature-card
        content: |
          Researchers argue for free research use to avoid academic exclusion,
          while musicians argue for compensation. Both are structurally right.
        props:
          eyebrow: Contradiction 2
          title: The research versus commerce trap
          icon: book-open
          items:
            - Public good versus private capture
            - Different access rules are needed
      - type: feature-card
        content: |
          Platforms first feared low-quality spam, but the deeper issue became
          high-quality flood that is hard to distinguish at scale.
        props:
          eyebrow: Contradiction 3
          title: The quality-quantity inversion
          icon: chart-column
          items:
            - Detection lags capability
            - Quality filters alone are insufficient
      - type: feature-card
        content: |
          Interviewees discussed labels and platforms as power centers, while
          cloud providers and GPU manufacturers remained largely invisible.
        props:
          eyebrow: Contradiction 4
          title: The invisible regulator
          icon: shield-check
          items:
            - Infrastructure is governance
            - Policy misses the deep dependency shift

  - id: section-intervention
    title: Section III
    description: Where the research sees practical and paradigm-level opportunities
      for intervention.
    layout: title-left
    transition: slide-up
    components:
      - type: label
        content: Section III
        props: { tone: secondary }
      - type: headline
        content: Leverage Points And Intervention Strategy
        props: { level: 2 }
      - type: subtitle
        content: The research moves from diagnosis to action by separating
          lower-leverage fixes from deeper institutional and worldview shifts.

  - id: low-leverage
    title: Low Leverage But Useful
    description: Information and payout fixes that do not solve the whole system but
      can still create room for reform.
    layout: grid-2x2
    transition: slide-left
    components:
      - type: feature-card
        content: |
          Require platforms to label generation method in metadata: Human,
          AI-Assisted, and Fully AI. This restores information needed for
          consumer choice and authenticity premiums.
        props:
          eyebrow: Intervention 1
          title: Transparency in AI labeling
          icon: shield-check
          items:
            - Enables conscious choice
            - Needs verification infrastructure
            - Works best when friction is low
      - type: feature-card
        content: |
          Platforms pay differently for professional human music and functional
          AI audio as an interim step while deeper reforms are designed.
        props:
          eyebrow: Intervention 2
          title: Two-tier royalty systems
          icon: chart-column
          items:
            - Immediate partial relief
            - Mirrors existing market distinctions
            - Hybrid cases remain contested
      - type: callout
        content: |
          Low leverage measures do not solve the full system problem, but they
          can reduce information asymmetry and create space for deeper reform.
        props:
          title: Why they still matter
          variant: note

  - id: medium-leverage
    title: Medium Leverage Interventions
    description: Institutional interventions that redirect existing infrastructure
      toward fairer governance.
    layout: grid-2x2
    transition: slide-up
    components:
      - type: feature-card
        content: |
          Artists opt in or out of training datasets through registries, and
          micro-royalties are distributed when their work is used.
        props:
          eyebrow: Intervention 3
          title: Consent-based training registries
          icon: database
          items:
            - Turns extraction into exchange
            - Requires legal compliance
      - type: feature-card
        content: |
          Performing Rights Organizations can extend their tracking and payment
          infrastructure from public performance toward training data use.
        props:
          eyebrow: Intervention 4
          title: Redirect PRO infrastructure
          icon: route
          items:
            - Leverages existing institutions
            - Needs governance reform
      - type: feature-card
        content: |
          UNESCO and cultural ministries can fund large-scale digitization and
          PEFT-based integration of non-Western musical traditions.
        props:
          eyebrow: Intervention 5
          title: Global South dataset initiatives
          icon: globe
          items:
            - Breaks Western data monopoly
            - Must avoid extractive digitization
      - type: callout
        content: |
          Medium leverage works by changing who has standing in the system and
          what infrastructure already in place can be redirected toward justice.
        props:
          title: Institutional pivot
          variant: important

  - id: high-leverage
    title: High Leverage And Paradigm Shifts
    description: The interventions that most directly change the system's incentive
      logic and meaning structure.
    layout: grid-2x2
    transition: slide-left
    components:
      - type: feature-card
        content: |
          Replace pro-rata royalties with systems that reward diversity,
          innovation, context, and cultural contribution rather than raw volume.
        props:
          eyebrow: Intervention 6
          title: Quality-weighted value systems
          icon: scale
      - type: feature-card
        content: |
          Protect academic use of copyrighted data for research so public
          institutions can audit and improve the system rather than being locked out by industry.
        props:
          eyebrow: Intervention 7
          title: Right to Research protections
          icon: book-open
      - type: feature-card
        content: |
          Decouple artist income from reproduction volume through cultural UBI
          and public funding models that recognize music as a public good.
        props:
          eyebrow: Intervention 8
          title: Post-scarcity cultural economics
          icon: chart-column
      - type: feature-card
        content: |
          Reframe music from product to relationship, where value lies in
          context, meaning, and lived experience rather than just the audio file.
        props:
          eyebrow: Intervention 9
          title: Music as relationship
          icon: users

  - id: constraints-risks
    title: Constraints And Risks
    description: The technical, economic, political, cultural, and temporal barriers
      that complicate transition.
    layout: grid-3x2
    transition: slide-up
    components:
      - type: feature-card
        content: |
          AI quality improves faster than detection and verification systems,
          creating an arms race around provenance and classification.
        props:
          eyebrow: Technical
          title: Capability outruns detection
          icon: triangle-alert
      - type: feature-card
        content: |
          Platforms are highly concentrated and unlikely to self-regulate while
          musicians are too economically fragile to absorb transition costs.
        props:
          eyebrow: Economic
          title: Power is unevenly distributed
          icon: chart-column
      - type: feature-card
        content: |
          International coordination is hard, digital governance is uneven, and
          tech lobbies dramatically outspend artist advocacy.
        props:
          eyebrow: Political
          title: Coordination is weak
          icon: shield-check
      - type: feature-card
        content: |
          Authenticity is culturally variable, and preservation efforts can slide
          into museum-ification instead of living evolution.
        props:
          eyebrow: Cultural
          title: Values are contested
          icon: globe
      - type: feature-card
        content: |
          The intervention window is closing fast: market structures form in two
          to three years while legal responses often take five to ten.
        props:
          eyebrow: Temporal
          title: Lock-in happens early
          icon: clock
      - type: callout
        content: |
          The system's speed is itself part of the problem. By the time visible
          harm becomes undeniable, path dependency may already be entrenched.
        props:
          title: Strategic risk
          variant: warning

  - id: ethical-considerations
    title: Ethical Considerations
    description: The normative guardrails the research uses to evaluate possible
      interventions.
    layout: grid-3x2
    transition: slide-left
    components:
      - type: feature-card
        content: |
          The analysis resists treating AI as an inevitable force that everyone
          must simply adapt to. Technology reflects power and policy choices.
        props:
          eyebrow: Ethics 1
          title: Avoid technological determinism
      - type: feature-card
        content: |
          Global South artists and indigenous communities must lead decisions
          about their cultural data instead of being "helped" through new extraction.
        props:
          eyebrow: Ethics 2
          title: Center marginalized voices
      - type: feature-card
        content: |
          Consent tools are necessary but not sufficient. Some harms may not be
          solvable through technical optimization alone.
        props:
          eyebrow: Ethics 3
          title: Resist solutionism
      - type: feature-card
        content: |
          Decisions made now about data, payouts, and algorithms shape cultural
          possibilities for decades.
        props:
          eyebrow: Ethics 4
          title: Practice intergenerational justice
      - type: feature-card
        content: |
          Compute-intensive generation affects all life through climate cost, so
          policy must include carbon budgets and renewable energy obligations.
        props:
          eyebrow: Ethics 5
          title: Include non-human stakeholders
      - type: callout
        content: |
          The ethical challenge is not just fairness for creators. It is also
          stewardship for cultural diversity and planetary limits.
        props:
          title: Ethical center of gravity
          variant: important

  - id: section-future
    title: Section IV
    description: The long-range direction of change and the transition conditions
      needed to get there.
    layout: title-left
    transition: slide-up
    components:
      - type: label
        content: Section IV
        props: { tone: secondary }
      - type: headline
        content: Future Direction And Transition Pathway
        props: { level: 2 }
      - type: subtitle
        content: The final section outlines the 2040 horizon, the system changes
          required, and the transition sequence that could make it plausible.

  - id: future-vision
    title: 2040 Vision
    description: The desired future state of a transparent, diverse, and
      regenerative music ecosystem.
    layout: grid-3x2
    transition: slide-up
    components:
      - type: feature-card
        content: |
          Human, collaborative, and fully AI music coexist transparently. No
          single mode dominates the ecosystem.
        props:
          eyebrow: Future condition
          title: Pluralistic musical ecosystem
          icon: users
      - type: feature-card
        content: |
          Datasets reach real global diversity, with 50/50 Global North-South
          representation and protections for indigenous traditions.
        props:
          eyebrow: Future condition
          title: Representational parity
          icon: globe
      - type: feature-card
        content: |
          Artists control their data through federated registries and receive
          micro-royalties whenever their styles help train systems.
        props:
          eyebrow: Future condition
          title: Consent-first data economy
          icon: database
      - type: feature-card
        content: |
          Platforms reward cultural contribution, context, innovation, and
          diversity instead of simply counting streams.
        props:
          eyebrow: Future condition
          title: Quality-weighted value systems
          icon: scale
      - type: feature-card
        content: |
          Music income shifts toward teaching, contextualizing, live presence,
          and other forms of meaning labor backed by public investment.
        props:
          eyebrow: Future condition
          title: Post-scarcity cultural economics
          icon: book-open
      - type: feature-card
        content: |
          AI music systems become energy accountable, renewable-powered, and
          optimized for efficiency rather than extractive scale.
        props:
          eyebrow: Future condition
          title: Net-zero music infrastructure
          icon: chart-column

  - id: system-change-levels
    title: What Must Change In The System
    description: The individual, organizational, and societal shifts required for
      the future vision to take hold.
    layout: grid-2x2
    transition: slide-left
    components:
      - type: feature-card
        content: |
          Musicians shift from content-creator identity toward meaning-maker
          identity, while listeners develop critical literacy about recommendation systems.
        props:
          eyebrow: Individual level
          title: New identities and habits
          icon: user
      - type: feature-card
        content: |
          Platforms become commons stewards, AI firms publish transparency
          reports, PROs become training registries, and labels pivot toward development and archiving.
        props:
          eyebrow: Organizational level
          title: Institutional redesign
          icon: route
      - type: feature-card
        content: |
          Public policy establishes data sovereignty, Right to Research
          protections, compute accountability, and cultural UBI experiments.
        props:
          eyebrow: Societal level
          title: Public rulemaking
          icon: shield-check
      - type: callout
        content: |
          The long-term aim is living musical heritage: traditions remain active,
          evolving, and community-governed rather than frozen as museum artifacts.
        props:
          title: Cultural horizon
          variant: note

  - id: tipping-points
    title: Tipping Points On The Roadmap
    description: The milestones that would signal the transition is moving from
      possibility toward regime change.
    layout: timeline-layout
    transition: slide-up
    components:
      - type: timeline-item
        content: Human Certified labels reach enough adoption to prove market viability
          and accelerate regulation.
        props:
          {
            date: '2027',
            title: 'Label adoption reaches 30%',
            marker: number,
            markerValue: '1'
          }
      - type: timeline-item
        content: National Right to Research protections allow academic institutions to
          audit and improve biased systems.
        props:
          {
            date: '2030',
            title: 'Research protections pass',
            marker: number,
            markerValue: '2'
          }
      - type: timeline-item
        content: Major training datasets hit 50/50 Global North-South representation,
          weakening homogenization loops.
        props:
          {
            date: '2033',
            title: 'Representational parity milestone',
            marker: number,
            markerValue: '3'
          }
      - type: timeline-item
        content: Quality-weighted royalty systems become industry standard, changing
          platform incentives at the structural level.
        props:
          {
            date: '2035',
            title: 'Value logic changes',
            marker: number,
            markerValue: '4'
          }
      - type: timeline-item
        content: Post-scarcity cultural economics become normalized and music is treated
          as a public good worthy of collective investment.
        props:
          {
            date: '2040',
            title: 'New regime stabilizes',
            marker: number,
            markerValue: '5'
          }

  - id: closing
    title: Closing
    description: The final invitation the research leaves with musicians, platforms,
      policymakers, and listeners.
    layout: title-left
    transition: scale
    components:
      - type: label
        content: Closing reflection
        props: { tone: primary }
      - type: headline
        content: The future of music is contested terrain
        props: { level: 2 }
      - type: subtitle
        content: |
          The system is at a critical juncture. Lock-in is happening in real
          time, but pockets of the future already prove alternatives exist.
      - type: blockquote
        content: |
          This is not a forecast; it is an invitation. The central question
          isn't "Can we stop AI?" but "What kind of AI music system do we want to build together?"
        props:
          attribution: Closing reflection from the research
          variant: large
      - type: footnote
        content: |
          What is needed now is coordination: musicians organizing, platforms
          redesigning value systems, policymakers protecting data sovereignty,
          listeners demanding transparency, and researchers building public alternatives.
