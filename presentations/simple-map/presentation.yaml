meta:
  title: Xtoryteller Simple Map Demo
  slug: simple-map
  description: A compact canonical Map presentation showing how Xtoryteller uses clusters, diagrams, and guided navigation.
  author: Xtoryteller
  tags: [map, demo, canonical, overview]
  createdAt: '2026-03-31'
  updatedAt: '2026-03-31'
mode: map
theme: xinimalist-paper
background:
  type: paper-shader
  presetRef: tidal-waves
canvas:
  spacing: 380
  initialZoom: 0.88
navigation:
  sequence: [overview, philosophy, system-loop, mode-fit, synthesis]
clusters:
  - id: overview
    title: Overview
    description: The high-level framing cluster for the map runtime.
    group: intro
    layout: title-center
    anchor: { x: 0, y: 0 }
    components:
      - type: headline
        content: Map mode
        props: { align: center }
      - type: subtitle
        content: Explore related ideas spatially, then guide people through them when you need a clear narrative path.
        props: { align: center }
      - type: svg-graphic
        props:
          src: assets/hero.svg
          alt: Abstract map-mode hero illustration
  - id: philosophy
    title: Why a map exists
    description: Why spatial storytelling matters in this project.
    group: intro
    layout: sidebar-main
    anchor:
      relativeTo: overview
      direction: right
      distance: 660
    components:
      - type: callout
        content: Map mode is for systems, relationships, workshops, and any story where *orientation* matters as much as sequence.
        props:
          title: Best fit
          variant: important
      - type: bullet-list
        props:
          items:
            - Clusters preserve context instead of flattening everything into slides.
            - Camera movement can explain relationships between ideas.
            - Guided and free-roam modes support both presentation and exploration.
  - id: system-loop
    title: System loop
    description: The compounding logic behind Xtoryteller.
    group: analysis
    layout: single-content
    anchor:
      relativeTo: overview
      direction: below
      distance: 520
    components:
      - type: mind-map
        props:
          root: { label: Xtoryteller }
          branches:
            - label: Agent skill surface
            - label: YAML orchestration
            - label: Reusable primitives
            - label: Browser runtime
            - label: Validation and portability
  - id: mode-fit
    title: Choosing the mode
    description: The simplest mental model for when to use Stage vs Map.
    group: analysis
    layout: two-column
    anchor:
      relativeTo: philosophy
      direction: below
      distance: 520
    components:
      - type: body-text
        content: |
          Use **Stage** when the audience should move through a clearly ordered
          story beat by beat. Use **Map** when the subject is a landscape,
          network, architecture, system, or strategy space.
      - type: spectrum-bar
        props:
          leftLabel: Linear
          rightLabel: Exploratory
          markers:
            - { label: Launch talk, position: 0.18 }
            - { label: Product walkthrough, position: 0.36 }
            - { label: Architecture review, position: 0.68 }
            - { label: Strategy workshop, position: 0.86 }
  - id: synthesis
    title: Synthesis
    description: Pull the map back into one memorable idea.
    group: synthesis
    layout: single-content
    anchor:
      relativeTo: system-loop
      direction: right
      distance: 660
    components:
      - type: blockquote
        content: >-
          The map is not a gimmick. It is a memory aid, a systems lens, and a
          more honest way to present connected ideas.
        props:
          attribution: Xtoryteller framing

