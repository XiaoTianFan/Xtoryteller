meta:
  title: Preset Tech Signal
  slug: preset-tech-signal
  description: Stage fixture for specialty tech preset motifs.
  author: Xtoryteller
  tags: [stage, preset, tech, neon]
  createdAt: 2026-04-01
  updatedAt: 2026-04-01
mode: stage
theme: neon-cyber
background:
  type: paper-shader
  shader: grain-gradient
  preset: wave
  colorStops: ['#0a0f1c', '#00ffcc', '#ff00aa']
steps:
  - id: hero
    title: Hero
    layout: asymmetric-split
    layoutProps: { ratio: 60-40, ornamentAnchor: top-right }
    transition: fade
    components:
      - type: label
        slot: main
        content: energetic
        props: { tone: primary }
      - type: headline
        slot: main
        content: Specialty Tech Themes Need Structure Too
      - type: subtitle
        slot: main
        content: Pattern overlays, chapter markers, and code surfaces carry the tone without inventing a particle engine.
      - type: chapter-nav
        slot: support
        props:
          items: [signal, flow, system, share]
          active: 1
          orientation: vertical
      - type: edge-rail
        slot: ornament
        props:
          items:
            - { label: mood, height: short, tone: accent }
            - { label: pace, height: medium, tone: primary, active: true }
            - { label: glow, height: short, color: 'var(--color-decor-rail-4)' }
          variant: pills
          side: right
          orientation: horizontal
  - id: proof
    title: Proof
    layout: two-column
    transition: slide-left
    components:
      - type: code-block
        props:
          language: yaml
          filename: preview.yaml
        content: |
          theme: neon-cyber
          layout: asymmetric-split
          background:
            type: paper-shader
            shader: grain-gradient
      - type: callout
        content: The theme, layout, and background do the heavy lifting together. The preset should still be reusable from normal YAML.
        props:
          title: System rule
          variant: info
