meta:
  title: Roadmap Tree
  slug: roadmap-tree
  description: A map-mode example that exercises the Phase 3 tree arrangement algorithm.
  author: Xtoryteller
  tags: [phase-3, map, tree]
  createdAt: 2026-03-31
  updatedAt: 2026-03-31
mode: map
theme: default
canvas:
  spacing: 260
  initialZoom: 0.82
navigation:
  sequence: [root, runtime, library, dashboard, validation, portability]
clusters:
  - id: root
    title: Phase 3
    description: Expand breadth without breaking the original runtime contract.
    group: root
    layout: title-center
    arrangement:
      algorithm: tree
      spacing: 260
    components:
      - type: label
        content: Roadmap
      - type: headline
        content: Phase 3 foundation
        props: { align: center }
  - id: runtime
    title: Runtime
    description: Strengthen the existing engine before adding more surface area.
    group: systems
    layout: single-content
    anchor:
      relativeTo: root
    components:
      - type: bullet-list
        props:
          items:
            - Serve presentation assets through the app.
            - Honor layout props and positioned scattered items.
  - id: library
    title: Library
    description: Add more layouts and content primitives.
    group: systems
    layout: single-content
    anchor:
      relativeTo: root
    components:
      - type: bullet-list
        props:
          items:
            - Expand layout vocabulary.
            - Add timeline and card variants.
  - id: dashboard
    title: Dashboard
    description: Make a growing presentation library easier to browse.
    group: experience
    layout: single-content
    anchor:
      relativeTo: library
    components:
      - type: bullet-list
        props:
          items:
            - Search presentation content.
            - Filter by tags.
            - Sort by title or recency.
  - id: validation
    title: Validation
    description: Add guardrails that match the broader design surface.
    group: experience
    layout: single-content
    anchor:
      relativeTo: library
    components:
      - type: bullet-list
        props:
          items:
            - Theme contrast checks.
            - Font role validation.
  - id: portability
    title: Portability
    description: The natural next branch after this foundational expansion.
    group: future
    layout: single-content
    anchor:
      relativeTo: root
    components:
      - type: callout
        content: Export/import remains the clearest next step to finish the portability half of Phase 3.
        props:
          title: Next branch
          variant: tip
