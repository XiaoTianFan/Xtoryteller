  - id: h1-under-pressure
    title: Horizon 1
    description: The current regime remains dominant, but its legitimacy and
      resilience are declining.
    group: transition
    layout: stack
    anchor:
      x: 2929
      y: 66
    frame:
      width: 528
      height: 280
    components:
      - type: bullet-list
        props:
          items:
            - "Declining concerns: pro-rata royalties, opaque curation,
              uncompensated training, Western data lock-in."
            - "Retain and adapt: attribution, consent, PRO infrastructure, live
              performance ecosystems, open research norms."
        style:
          gap: 0.34rem
          lineHeight: 1.28
  - id: h2-bridge
    title: Horizon 2
    description: Transitional innovations are necessary bridges, not endpoints.
    group: transition
    layout: stack
    anchor:
      x: 3462
      y: 43
    frame:
      width: 530
      height: 330
    components:
      - type: body-text
        content: >
          Horizon 2 holds the pragmatic bridge mechanisms that create pressure,

          test feasibility, and move norms before deep institutional change is
          complete.
        props:
          maxWidth: 62ch
      - type: bullet-list
        props:
          items:
            - Voluntary Human Certified labels and sync disclosure.
            - Artist licensing co-ops and AI training registries.
            - Carbon reporting and offset schemes as stepping stones to harder
              standards.
        style:
          gap: 0.34rem
          lineHeight: 1.28
  - id: h3-future
    title: Horizon 3
    description: The desired future is co-existence architecture, not
      anti-technology nostalgia.
    group: transition
    layout: stack
    anchor:
      x: 4000
      y: 50
    frame:
      width: 475
      height: 320
    components:
      - type: bullet-list
        props:
          items:
            - Provenance, compensation, and diversity shape the rules of
              coexistence.
            - Pockets of the future already exist in Holly+, Spawning.ai, C2PA,
              Bandcamp Fridays, and PEFT diversity research.
            - Long-term value shifts toward context, meaning labor, and
              renewable compute.
        style:
          gap: 0.34rem
          lineHeight: 1.28
  - id: critical-insights
    title: Seven Critical Insights
    description: The synthesis points toward infrastructural and cultural leverage
      points rather than purely aesthetic fixes.
    group: action
    layout: two-column
    anchor:
      x: 1693
      y: 1310
    frame:
      width: 1076
      height: 293
    components:
      - type: bullet-list
        props:
          items:
            - Infrastructure power now matters as much as label power.
            - The royalty pool behaves like a tragedy of the commons.
            - Data colonialism compounds economic colonialism.
            - Causal reasoning and context remain key human strengths.
        style:
          gap: 0.28rem
          lineHeight: 1.22
          fontSize: 0.94rem
      - type: bullet-list
        props:
          items:
            - Authenticity is socially constructed but still economically
              consequential.
            - Voluntary markets often prefigure later regulation.
            - The system will not self-correct without coordinated intervention.
        style:
          gap: 0.28rem
          lineHeight: 1.22
          fontSize: 0.94rem
  - id: roadmap-transition-graph
    title: Roadmap by Design
    description: The transition pathway is reframed as a phased ring graph that
      connects strategy, stakeholders, and system support over time.
    group: action
    labelPosition: bottom-left
    layout: single-content
    anchor:
      x: 1877
      y: 1262
    frame:
      width: 2523
      height: 1149
    components:
      - type: roadmap-rings
        props:
          phases:
            - label: "PILOT: INCUBATING"
              dateRange: 2025-2027
              size: sm
              strategy:
                title: Fairchain Music Collective
                subtitle: Pilot platform for ethical AI music
                items:
                  - label: Transparent provenance system
                    detail: >-
                      - Metadata tagging: Human / AI-Assisted / Fully AI /
                      Hybrid

                      - C2PA pilot for cryptographic verification

                      - One-click filter for "Show only Human Certified"
                  - label: Consent-based training registry
                    detail: |-
                      - 1,000 artist pilot cohort with opt-in / opt-out controls
                      - Blockchain-backed verification for permissions
                      - Micro-royalty distribution even at pilot scale
                  - label: Quality-weighted royalty model
                    detail: >-
                      - Replace pro-rata logic with a cultural contribution
                      score

                      - Show artists a transparent valuation dashboard

                      - Monthly payouts with a detailed breakdown
                  - label: Direct artist-listener features
                    detail: |-
                      - Story-behind-the-song pages make meaning labor visible
                      - Integrated patronage layer for direct support
                      - Community dialogue spaces between artists and listeners
                  - label: Carbon footprint tracking
                    detail: |-
                      - Display gCO2e per stream and per AI generation
                      - Give listeners a monthly carbon dashboard
                      - Recommend lower-carbon listening paths
              actors:
                title: Actors / Stakeholders
                items:
                  - label: Early adopter artists
                    detail: >-
                      - 1,000 values-aligned artists act as co-designers and
                      evangelists

                      - Mix of established indie, emerging, and non-Western /
                      experimental voices
                  - label: Ethical listeners
                    detail: >-
                      - Target a first wave of 50K-100K values-driven listeners

                      - Use feedback and word-of-mouth to test demand for
                      ethical defaults
                  - label: Indie platform partner
                    detail: >-
                      - Pair with Bandcamp or an equivalent artist-friendly
                      platform

                      - Use the partner as integration layer, distribution
                      channel, and co-funder
                  - label: Technical + research team
                    detail: >-
                      - Combine product, infrastructure, security, and
                      evaluation roles

                      - Track economic, cultural, and UX outcomes from the start
                  - label: Legal + artist governance
                    detail: >-
                      - Add IP and tech-policy guidance early

                      - Give an artist steering body real veto power over core
                      changes
              support:
                title: System Support
                items:
                  - label: Legal templates
                    detail: >-
                      - Model consent agreements for training-data use

                      - Terms of service and privacy patterns that preserve
                      artist autonomy
                  - label: Metadata + UX standards
                    detail: >-
                      - Draft a generation-method metadata schema

                      - Establish transparency UX patterns that avoid
                      dark-pattern behavior
                  - label: Artist capability building
                    detail: >-
                      - Workshops on data rights, royalty logic, and
                      story-building

                      - Technical help for tagging catalog metadata and
                      onboarding artists
                  - label: Evaluation + learning loops
                    detail: >-
                      - Track listener filtering, artist income, retention, and
                      carbon metrics

                      - Use monthly reviews, incident reports, and public
                      transparency updates
                  - label: Blended pilot funding
                    detail: >-
                      - Run the pilot on a €1-1.5M mix of foundation grants,
                      impact capital, crowdfunding, and partner support

                      - Keep enough contingency to treat the pilot as a learning
                      laboratory
            - label: "SCALE: CONNECTING"
              dateRange: 2028-2032
              size: md
              strategy:
                title: Ethical Music Network
                subtitle: Federated ecosystem of platforms and collectives
                items:
                  - label: Interoperable standards
                    detail: >-
                      - Extend metadata and provenance standards across 10+
                      platforms

                      - Make consent verification and human-certification
                      portable across the network
                  - label: Co-owned artist collectives
                    detail: >-
                      - Grow toward 100,000 artists in federated cooperatives

                      - Use one-artist / one-vote governance for major
                      infrastructure choices
                  - label: PRO training royalties
                    detail: >-
                      - Pilot AI-training royalty distribution through existing
                      PRO infrastructure

                      - Prove that legacy institutions can extend into the new
                      economy
                  - label: Global South integration
                    detail: >-
                      - Fund digitization projects in 10 countries

                      - Use PEFT toolkits to bring non-Western music into the
                      network on better terms
                  - label: Carbon accountability at scale
                    detail: >-
                      - Move 30% of streaming infrastructure toward renewables

                      - Normalize carbon labeling and launch green AI music
                      certification
              actors:
                title: Actors / Stakeholders
                items:
                  - label: Platform partners
                    detail: >-
                      - Coordinate 10-15 platform partners across indie,
                      startup, and reluctant mainstream adopters

                      - Use shared standards and pooled data to create positive
                      network effects
                  - label: Collectives + unions
                    detail: >-
                      - Regional and genre-based artist collectives organize
                      bargaining, education, and mutual aid

                      - Governance shifts from isolated artists toward
                      collective infrastructure power
                  - label: PRO pioneers
                    detail: >-
                      - ASCAP, PRS, SOCAN, APRA AMCOS, and SACEM test new
                      royalty pathways

                      - Existing distribution networks become transition
                      infrastructure
                  - label: Ethical AI + cultural institutions
                    detail: >-
                      - Consent-based AI companies, UNESCO, WIPO, and libraries
                      add legitimacy and funding

                      - Preservation and commercialization get linked through
                      shared governance
                  - label: Standards, research, and capital network
                    detail: >-
                      - ISO, W3C, C2PA, researchers, journalists, and impact
                      investors turn the model into a visible movement

                      - Evidence, narrative, and patient capital reinforce one
                      another
              support:
                title: System Support
                items:
                  - label: Coalition knowledge base
                    detail: >-
                      - Build an international coalition with multilingual
                      documentation and rotating convenings

                      - Share open-source playbooks for governance, royalties,
                      and digitization
                  - label: Training + bootcamps
                    detail: >-
                      - Train PRO staff, artists, and Global South practitioners
                      in AI royalties, consent tools, and dataset stewardship

                      - Combine workshops, scholarships, and residencies
                  - label: Longitudinal evaluation
                    detail: >-
                      - Track artist well-being, income, cultural diversity, and
                      platform payout models over multiple years

                      - Keep an annual State of Ethical Music report as a public
                      feedback loop
                  - label: 40-60M funding mix
                    detail: >-
                      - Blend public cultural funding, platform revenue
                      contributions, philanthropy, impact investment, and
                      registry fees

                      - Keep the network expandable without one owner capturing
                      it
                  - label: Regional experiments + allies
                    detail: >-
                      - Let EU, US, Global South, and East Asia variants evolve
                      within shared principles

                      - Work with fellow-traveler groups such as Creative
                      Commons, EFF, Algorithm Watch, and labor unions
            - label: "PRACTICE: EMBEDDED IN THE REGIME"
              dateRange: 2038-2040
              size: lg
              strategy:
                title: Regenerative Music System
                subtitle: H3 vision fully realized
                items:
                  - label: Mandatory transparency
                    detail: >-
                      - EU and US regimes require generation-method disclosure
                      for all music

                      - Platforms without compliance face real penalties and
                      distribution consequences
                  - label: Consent as international law
                    detail: >-
                      - WIPO-scale treaty logic makes training without consent
                      infringement

                      - Micro-royalties are collected and distributed globally
                      by default
                  - label: Quality-weighted royalties
                    detail: >-
                      - Pro-rata becomes a legacy edge case rather than the norm

                      - Cultural contribution scoring and algorithmic audits
                      become standard practice
                  - label: Cultural UBI
                    detail: >-
                      - 20+ countries support artists with baseline income
                      infrastructure

                      - Streaming income is supplemented by public cultural
                      support
                  - label: Net-zero infrastructure
                    detail: >-
                      - Streaming and AI systems must run on renewable energy by
                      2040

                      - Carbon labels and compute-efficiency rules become
                      non-optional
                  - label: Global South parity
                    detail: >-
                      - Training datasets reach 50/50 Global North-South balance

                      - Cultural provenance routes royalties back to source
                      communities
              actors:
                title: Actors / Stakeholders
                items:
                  - label: Policymakers + governments
                    detail: >-
                      - Legislators, regulators, UNESCO, and WIPO embed
                      transparency, data sovereignty, and cultural rights into
                      law

                      - Global South governments become agenda setters rather
                      than edge participants
                  - label: Major platforms
                    detail: >-
                      - Spotify, Apple, YouTube, and Amazon are forced into
                      compliant governance and better creator economics

                      - Artist-owned alternatives hold meaningful market share
                  - label: Cloud + GPU infrastructure
                    detail: >-
                      - AWS, Azure, Google Cloud, Nvidia, and TSMC operate under
                      carbon, access, and efficiency constraints

                      - Compute becomes governed infrastructure, not just
                      private leverage
                  - label: Artist communities
                    detail: >-
                      - Millions of organized musicians bargain collectively and
                      shape norms

                      - Global South creators hold far greater revenue share and
                      cultural visibility
                  - label: Civil society + academia
                    detail: >-
                      - Consumer movements, climate activists, educators,
                      universities, and mainstream media normalize the new
                      regime

                      - Ethical AI music becomes part of basic literacy, not a
                      niche debate
              support:
                title: System Support
                items:
                  - label: Public cultural funding
                    detail: >-
                      - Governments, EU programs, and multilateral funds treat
                      music-tech equity as durable infrastructure

                      - Cultural development money flows to preservation,
                      education, and inclusive compute access
                  - label: Industry standards
                    detail: >-
                      - Trade associations, professional bodies, and ESG
                      reporting lock the norms into operating practice

                      - Ethical sourcing becomes an expected part of
                      music-sector governance
                  - label: Mainstream legitimacy
                    detail: >-
                      - Business schools, major media, and public case studies
                      frame the shift as a model for just tech transitions

                      - The narrative moves from fringe ethics to mainstream
                      competitive advantage
                  - label: Conscious streaming movement
                    detail: >-
                      - Popular artist endorsements and consumer pressure reward
                      compliant platforms

                      - Human-certified listening becomes a visible cultural
                      identity marker
                  - label: Policy enforcement
                    detail: >-
                      - Copyright, carbon rules, data-sovereignty treaties,
                      right-to-research protections, and antitrust measures are
                      actively enforced

                      - Interoperability and artist data portability become
                      baseline expectations
