  - id: transition-map
    title: Transition Map
    description: The Three Horizons frame translates diagnosis into a strategic transition between 2025 and 2040.
    group: transition
    layout: single-content
    frame: { width: 780, height: 660 }
    anchor: { x: 3280, y: 0 }
    components:
      - type: three-horizons
        props:
          horizon1:
            label: Horizon 1
            color: var(--color-warning)
            items:
              - Pro-rata royalties
              - Unregulated scraping
              - Algorithm opacity
              - Western data monopoly
          horizon2:
            label: Horizon 2
            color: var(--color-primary)
            items:
              - Human certification
              - Licensing co-ops
              - Disclosure standards
              - Carbon accounting
          horizon3:
            label: Horizon 3
            color: var(--color-success)
            items:
              - Consent-first training
              - Representational parity
              - Provenance by default
              - Net-zero infrastructure
          timeLabels:
            start: 2025
            mid: 2030
            end: 2040

  - id: h1-under-pressure
    title: Horizon 1
    description: The current regime remains dominant, but its legitimacy and resilience are declining.
    group: transition
    layout: stack
    frame: { width: 780, height: 260 }
    anchor: { x: 3280, y: 720 }
    components:
      - type: bullet-list
        props:
          items:
            - "Declining concerns: pro-rata royalties, opaque curation, uncompensated training, Western data lock-in."
            - "Retain and adapt: attribution, consent, PRO infrastructure, live performance ecosystems, open research norms."
        style:
          gap: 0.34rem
          lineHeight: 1.28

  - id: h2-bridge
    title: Horizon 2
    description: Transitional innovations are necessary bridges, not endpoints.
    group: transition
    layout: stack
    frame: { width: 780, height: 300 }
    anchor: { x: 3280, y: 1030 }
    components:
      - type: body-text
        content: |
          Horizon 2 holds the pragmatic bridge mechanisms that create pressure,
          test feasibility, and move norms before deep institutional change is complete.
        props:
          maxWidth: 62ch
      - type: bullet-list
        props:
          items:
            - Voluntary Human Certified labels and sync disclosure.
            - Artist licensing co-ops and AI training registries.
            - Carbon reporting and offset schemes as stepping stones to harder standards.
        style:
          gap: 0.34rem
          lineHeight: 1.28

  - id: h3-future
    title: Horizon 3
    description: The desired future is co-existence architecture, not anti-technology nostalgia.
    group: transition
    layout: stack
    frame: { width: 780, height: 290 }
    anchor: { x: 3280, y: 1390 }
    components:
      - type: bullet-list
        props:
          items:
            - Provenance, compensation, and diversity shape the rules of coexistence.
            - Pockets of the future already exist in Holly+, Spawning.ai, C2PA, Bandcamp Fridays, and PEFT diversity research.
            - Long-term value shifts toward context, meaning labor, and renewable compute.
        style:
          gap: 0.34rem
          lineHeight: 1.28

  - id: critical-insights
    title: Seven Critical Insights
    description: The synthesis points toward infrastructural and cultural leverage points rather than purely aesthetic fixes.
    group: action
    layout: two-column
