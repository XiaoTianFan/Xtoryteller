  - id: roadmap-timeline
    title: Macro Timeline
    description: >-
      2025–2027 prove, 2028–2032 connect, 2038–2040 embed—milestones and forces.
    layout: timeline-layout
    transition: slide-up
    components:
      - type: timeline-item
        content: >-
          Pilot phase proves: transparency works at human scale, listeners pay a
          premium for ethics, artist income rises when data is controlled, and a
          1k-artist / 50-100k-listener cohort can operate without requiring
          blockchain literacy from everyday users.
        props:
          date: '2025–2027'
          title: Prove the possible
          marker: number
          markerValue: '1'
      - type: timeline-item
        content: >-
          Network phase: 10+ platforms, 100k organized artists, €50M+ new
          funding; PRO training royalties live; interoperability prevents
          lock-in; annual State of Ethical Music reporting normalizes
          evaluation; ~20% ethical market share forces mainstream adoption.
        props:
          date: '2028–2032'
          title: Build the network
          marker: number
          markerValue: '2'
      - type: timeline-item
        content: >-
          Regime phase: transparency and consent are baseline law;
          quality-weighted payouts replace pro-rata for most listening; net-zero
          rules bind; Global South parity targets approach 50/50; pluralism
          feels like common sense rather than special pleading.
        props:
          date: '2038–2040'
          title: Embed the practice
          marker: number
          markerValue: '3'

  - id: synthesis
    title: Closing
    description: >-
      Parallel approaches, one sustaining purpose, and the cost of partial
      progress.
    layout: title-center
    transition: scale-out
    components:
      - type: label
        content: Closing
        props: { tone: secondary }
      - type: headline
        content: Parallel approaches, one sustaining purpose
        props: { level: 2, align: center }
      - type: body-text
        content: |
          Strategic outcomes A–D, six lived impacts, and **2040 regenerative
          pluralism** define the horizon. The path runs **pilot → network →
          embedded regime**—through concrete pilots, interoperability,
          organizing, and public evidence until better defaults hold.
        props: { align: center }
        style:
          maxWidth: 52rem
      - type: body-text
        content: >-
          Skip any approach and the others bottleneck; accelerate one without
          the others and you get brittle wins that collapse under extraction
          pressure. The test is whether we can show real cohorts, real metrics,
          and real governance before defaults harden.
        props: { align: center }
        style:
          maxWidth: 52rem
      - type: divider
        props: { variant: ornamental }
      - type: blockquote
        content: >-
          This is not a forecast—it is buildable infrastructure. The question is
          whether we assemble consent, pluralism, transparent value, and
          regeneration **in parallel**, or let defaults harden into another era
          of opacity.
        props:
          variant: large
