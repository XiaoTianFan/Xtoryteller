meta:
  title: Simple Stage Example
  slug: simple-stage
  description: A concise Stage-mode walkthrough demonstrating the Phase 1 runtime.
  author: Xtoryteller
  tags: [stage, demo, foundation]
  createdAt: 2026-03-31
  updatedAt: 2026-03-31
mode: stage
theme: default
background:
  type: paper
  colorStops:
    - 'rgba(247, 242, 234, 0.96)'
    - 'rgba(42, 108, 100, 0.18)'
    - 'rgba(141, 79, 45, 0.18)'
steps:
  - id: intro
    title: Opening
    layout: title-center
    transition: fade
    components:
      - type: headline
        content: Xtoryteller
        props: { level: 1, align: center }
      - type: subtitle
        content: A file-first runtime for agent-authored presentations.
        props: { align: center }
      - type: image
        props:
          src: assets/hero.svg
          alt: Abstract hero illustration
          caption: Built from reusable components, layouts, and YAML.
  - id: story
    title: Why it matters
    layout: content-left-media-right
    transition: slide-left
    components:
      - type: bullet-list
        build: sequential
        props:
          items:
            - Agents compose from infrastructure instead of regenerating raw HTML.
            - YAML keeps orchestration diffable and easy to validate.
            - The system grows stronger as new primitives accumulate.
      - type: callout
        content: Use **Stage mode** when you want a guided, linear story.
        props:
          variant: important
          title: Narrative fit
  - id: finish
    title: Close
    layout: single-content
    transition: scale
    components:
      - type: blockquote
        content: >-
          Every presentation created should make the next one easier,
          cleaner, and more personal.
        props:
          attribution: Xtoryteller APRD
