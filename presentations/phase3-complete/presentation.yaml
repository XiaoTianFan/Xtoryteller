meta:
  title: Phase 3 Complete
  slug: phase3-complete
  description: End-to-end showcase of the completed Phase 3 component suite and portability workflow.
  author: Codex
  tags: [phase-3, showcase, components, portability]
  createdAt: '2026-03-31'
  updatedAt: '2026-03-31'
mode: stage
theme: default
background:
  type: paper-shader
  variant: aurora
steps:
  - id: opening
    layout: stack
    transition: fade
    components:
      - type: icon
        props: { name: sparkles, size: xlarge, color: 'var(--color-primary)' }
      - type: headline
        content: Phase 3 Complete
      - type: subtitle
        content: The component suite, portability tooling, and verification surface now land as one buildable slice.
      - type: body-text
        content: |
          This presentation exercises the remaining Phase 3 primitives so validation and production build cover the full expansion.

  - id: cards
    layout: two-column
    transition: slide-up
    components:
      - type: profile-card
        props:
          name: Platform Team
          role: Runtime + Portability
        content: |
          Owns the presentation engine, validation pipeline, and packaging workflow.
      - type: feature-card
        props:
          eyebrow: Library
          title: Advanced primitives
          icon: layers-3
          items:
            - Diagram expansion
            - Better dashboard discovery
            - Import/export support
        content: |
          Phase 3 closes the gap between the APRD vision and the shipped registry surface.

  - id: horizons
    layout: single-content
    transition: slide-left
    components:
      - type: three-horizons
        props:
          horizon1:
            label: Core runtime
            items: [Stage mode, Map mode, Registry generation]
          horizon2:
            label: Expansion layer
            items: [New components, Tree arrangement, Theme checks]
          horizon3:
            label: Portable system
            items: [Export package, Import workflow, Promotion utility]
          timeLabels:
            start: Foundation
            mid: Expansion
            end: Shareable platform

  - id: pipeline
    layout: two-column
    transition: slide-right
    components:
      - type: spectrum-bar
        props:
          leftLabel: Static
          rightLabel: Portable
          markers:
            - { label: Local preview, position: 0.18 }
            - { label: Registry validated, position: 0.44 }
            - { label: Importable package, position: 0.82 }
      - type: funnel-diagram
        props:
          stages:
            - { label: Source YAML, value: 1 file }
            - { label: Dependencies resolved, value: 14 items }
            - { label: Package assembled, value: 1 zip }
            - { label: Target instance ready, value: 1 import }

  - id: overlap
    layout: two-column
    transition: wipe-left
    components:
      - type: venn-diagram
        props:
          sets:
            - { label: Storytelling, color: '#4f8ef7' }
            - { label: Infrastructure, color: '#2ba892' }
            - { label: Agent skill surface, color: '#f59e0b' }
          intersections:
            - { label: Xtoryteller runtime }
      - type: stakeholder-map
        props:
          center: Presentation package
          rings:
            - label: Immediate users
              stakeholders:
                - { label: Speaker }
                - { label: Reviewer, angle: 180 }
            - label: Platform consumers
              stakeholders:
                - { label: Other instances, angle: 45 }
                - { label: Skill system, angle: 180 }
                - { label: CI build, angle: 300 }

  - id: measurement
    layout: two-column
    transition: scale
    components:
      - type: radar-chart
        props:
          axes:
            - { label: Breadth }
            - { label: Runtime fit }
            - { label: Registry coverage }
            - { label: Portability }
            - { label: Examples }
          datasets:
            - label: Before
              color: '#94a3b8'
              values: [45, 58, 52, 20, 35]
            - label: After
              color: '#4f8ef7'
              values: [92, 86, 95, 88, 82]
      - type: coordinate-plot
        props:
          xAxis: { label: Build confidence, min: 0, max: 100 }
          yAxis: { label: Authoring range, min: 0, max: 100 }
          points:
            - { label: Stage core, x: 68, y: 62, radius: 18 }
            - { label: Map runtime, x: 77, y: 74, radius: 20 }
            - { label: Portability, x: 84, y: 88, radius: 22 }
            - { label: Diagram suite, x: 90, y: 86, radius: 24, color: '#f97316' }

  - id: structure
    layout: two-column
    transition: slide-down
    components:
      - type: org-chart
        props:
          root:
            label: Xtoryteller
            children:
              - label: Runtime
                children:
                  - { label: Stage }
                  - { label: Map }
              - label: Tooling
                children:
                  - { label: Validate }
                  - { label: Export }
                  - { label: Import }
      - type: cycle-diagram
        props:
          stages:
            - { label: Author, icon: sparkles }
            - { label: Validate, icon: check }
            - { label: Share, icon: arrow-right }
            - { label: Promote, icon: refresh-cw }

  - id: flow
    layout: single-content
    transition: blur
    components:
      - type: sankey-diagram
        props:
          nodes:
            - { id: source, label: Source }
            - { id: validate, label: Validate }
            - { id: package, label: Package }
            - { id: import, label: Import }
            - { id: library, label: Library }
          links:
            - { source: source, target: validate, value: 12 }
            - { source: validate, target: package, value: 10 }
            - { source: package, target: import, value: 8 }
            - { source: import, target: library, value: 6 }

  - id: close
    layout: stack
    transition: fade
    components:
      - type: headline
        content: Portability and the advanced suite now verify together.
      - type: bullet-list
        content: |
          - Registries expose the new manifests to the skill system.
          - `scripts/export.mjs`, `scripts/import.mjs`, and `scripts/promote-component.mjs` complete the portability workflow.
          - The Phase 3 showcase now covers every newly added component in one buildable example.
