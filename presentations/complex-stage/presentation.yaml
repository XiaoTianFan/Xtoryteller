meta:
  title: Xtoryteller Complex Stage Demo
  slug: complex-stage
  description: The canonical long-form Stage walkthrough covering Xtoryteller's philosophy, architecture, feature surface, tooling, and roadmap with broad built-in component and layout coverage.
  author: Xtoryteller
  tags: [stage, demo, canonical, complex, architecture]
  createdAt: '2026-03-31'
  updatedAt: '2026-04-01'
mode: stage
themeOverrides:
  colors:
    primary: '#7a3f63'
    secondary: '#1f6a7a'
steps:
  - id: opening
    title: Opening
    layout: title-left
    transition: fade
    components:
      - type: headline
        content: Xtoryteller
      - type: subtitle
        content: A self-hosted, agent-first presentation infrastructure that grows stronger every time it is used.
      - type: svg-graphic
        props:
          src: assets/hero.svg
          alt: Abstract Xtoryteller hero illustration
  - id: north-star
    title: North Star
    layout: section-header
    transition: slide-up
    components:
      - type: label
        content: Project thesis
        props: { tone: primary }
      - type: headline
        content: Build a durable storytelling system, not a stream of disposable slide exports.
        props: { level: 2 }
  - id: philosophy
    title: Philosophy
    layout: two-column
    layoutProps:
      ratio: 60-40
    transition: slide-left
    components:
      - type: body-text
        content: |
          Xtoryteller merges two ideas that are usually separated: conversational
          AI generation and persistent presentation infrastructure. Instead of
          asking an agent to emit fresh HTML every time, the system gives the
          agent a real design substrate: layouts, components, themes, transitions,
          validation rules, and examples.
      - type: bullet-list
        build: sequential
        props:
          items:
            - Agent as primary creator, human as director.
            - Infrastructure over generation.
            - YAML as declarative orchestration.
            - Browser-native rendering instead of constrained slide files.
            - Portability and ownership by default.
  - id: pillars
    title: Pillars
    layout: three-column
    transition: slide-up
    components:
      - type: feature-card
        content: The component, layout, transition, and theme libraries are the durable layer agents compose with.
        props:
          eyebrow: Pillar 1
          title: Persistent infrastructure
          icon: layers-3
      - type: feature-card
        content: Presentations are authored as structured YAML, which keeps output inspectable, diffable, and validatable.
        props:
          eyebrow: Pillar 2
          title: Declarative data
          icon: file-code
      - type: feature-card
        content: Stage and Map runtimes let one system support both guided talks and exploratory system views.
        props:
          eyebrow: Pillar 3
          title: Dual-mode storytelling
          icon: route
  - id: authoring-contract
    title: Authoring Contract
    layout: comparison-layout
    layoutProps:
      divider: vs
    transition: wipe-left
    components:
      - type: comparison-card
        content: Traditional AI slide generation often restarts from zero every time.
        props:
          title: Disposable workflow
          leftTitle: Typical output
          leftItems:
            - Raw generated HTML or ad-hoc markup
            - Inconsistent quality across runs
            - Weak accumulation of design learning
          rightTitle: Common pain
          rightItems:
            - Hard to trust
            - Hard to maintain
            - Hard to evolve
          variant: before-after
      - type: comparison-card
        content: Xtoryteller asks the agent to orchestrate proven infrastructure instead.
        props:
          title: Infrastructure workflow
          leftTitle: System surface
          leftItems:
            - Registries and manifests
            - YAML presentation files
            - Validation and preview tooling
          rightTitle: Result
          rightItems:
            - Higher trust
            - Easier iteration
            - Better long-term design identity
          variant: before-after
  - id: project-surface
    title: Project Surface
    layout: grid-3x2
    transition: slide-left
    components:
      - type: stat-card
        props:
          label: Built-in components
          value: '38'
          detail: Diagram, card, media, and text primitives available to every presentation.
      - type: stat-card
        props:
          label: Built-in layouts
          value: '19'
          detail: Title, split, grid, timeline, map-friendly, and special arrangements.
      - type: stat-card
        props:
          label: Built-in transitions
          value: '10'
          detail: Calm, dynamic, dramatic, and bold motion presets.
      - type: feature-card
        content: Search, filtering, sorting, and grid/list views let the dashboard scale as presentations accumulate.
        props:
          eyebrow: Dashboard
          title: Discovery layer
          icon: search
      - type: feature-card
        content: Validation checks schema fit, registry names, asset paths, build-step continuity, map references, and density warnings.
        props:
          eyebrow: Tooling
          title: Guardrails
          icon: shield-check
      - type: feature-card
        content: Import, export, and component promotion workflows make presentations portable rather than trapped in one instance.
        props:
          eyebrow: Portability
          title: Shareable artifacts
          icon: package
  - id: architecture
    title: Architecture
    layout: sidebar-main
    transition: slide-right
    components:
      - type: callout
        content: The file system is the database. The app reads presentations, manifests, and themes directly from disk.
        props:
          title: Architectural stance
          variant: important
      - type: org-chart
        props:
          root:
            label: Xtoryteller
            children:
              - label: Authoring
                children:
                  - { label: presentations/ }
                  - { label: themes/ }
                  - { label: skills/ }
              - label: Primitive libraries
                children:
                  - { label: components/ }
                  - { label: layouts/ }
                  - { label: transitions/ }
              - label: Runtime
                children:
                  - { label: Next.js routes }
                  - { label: XState machine }
                  - { label: Renderers }
  - id: yaml-runtime
    title: YAML Runtime Contract
    layout: top-bottom
    layoutProps:
      ratio: 60-40
    transition: slide-down
    components:
      - type: code-block
        props:
          filename: presentation.yaml
          language: yaml
        content: |
          meta:
            title: Example
            slug: example
          mode: stage
          theme: xinimalist-paper
          steps:
            - layout: title-center
              transition: fade
              components:
                - type: headline
                  content: Hello Xtoryteller
                - type: subtitle
                  content: YAML orchestrates the runtime.
      - type: numbered-list
        build: sequential
        props:
          items:
            - YAML describes what to render and when.
            - TSX components and layouts decide how it looks.
            - Validation ensures references and structure stay trustworthy.
  - id: pipeline
    title: Creation Pipeline
    layout: timeline-layout
    layoutProps:
      orientation: horizontal
    transition: slide-up
    components:
      - type: timeline-item
        content: Understand the shipped surface before inventing anything.
        props: { date: '1', title: 'Scan registries', marker: number, markerValue: '1' }
      - type: timeline-item
        content: Decide whether the story wants Stage or Map behavior.
        props: { date: '2', title: 'Shape the story', marker: number, markerValue: '2' }
      - type: timeline-item
        content: Write or modify `presentation.yaml` using built-ins first.
        props: { date: '3', title: 'Compose YAML', marker: number, markerValue: '3' }
      - type: timeline-item
        content: Run the validator to catch schema, registry, asset, and density issues.
        props: { date: '4', title: 'Validate', marker: number, markerValue: '4' }
      - type: timeline-item
        content: Review in the browser and iterate with targeted edits instead of regenerating everything.
        props: { date: '5', title: 'Preview and refine', marker: number, markerValue: '5' }
  - id: rendering
    title: Rendering Pipeline
    layout: media-left-content-right
    transition: blur
    components:
      - type: flowchart
        props:
          nodes:
            - { id: intent, label: User intent, type: start }
            - { id: registries, label: Scan skills + registries, type: action }
            - { id: yaml, label: Compose presentation YAML, type: action }
            - { id: validate, label: Validate structure, type: decision }
            - { id: render, label: Render in browser runtime, type: end }
          edges:
            - { from: intent, to: registries }
            - { from: registries, to: yaml }
            - { from: yaml, to: validate }
            - { from: validate, to: render }
      - type: body-text
        content: |
          The runtime is a browser application, not a static slide export in disguise.
          Stage uses sequential step and build progression. Map uses clusters, anchors,
          and camera motion. Themes resolve into CSS variables, and the renderers map
          YAML instances onto registered React components and layouts.
  - id: dashboard-surfaces
    title: Dashboard And Discovery Surfaces
    layout: gallery
    transition: slide-left
    components:
      - type: feature-card
        content: Search covers titles, tags, descriptions, and extracted component copy.
        props:
          eyebrow: Search scope
          title: Metadata-first index
          icon: search
      - type: feature-card
        content: Switch between grid and list views depending on whether you are browsing visually or scanning metadata.
        props:
          eyebrow: Browse
          title: Dual explorer views
          icon: layout-grid
      - type: feature-card
        content: Filter presentations by tags and sort by update date, creation date, or title.
        props:
          eyebrow: Organize
          title: Faster retrieval
          icon: filter
      - type: card
        content: |
          Presentation cards expose the title, description, mode, unit count,
          tags, update date, and a preview asset when one exists.
        props:
          header: Dashboard card contract
          variant: outlined
      - type: profile-card
        props:
          name: Agent Operator
          role: Primary workflow owner
        content: |
          Uses the dashboard to browse the growing presentation library, then
          hands control back to the browser viewer or the terminal agent loop.
      - type: callout
        content: The dashboard matters because a presentation system is only useful at scale if people can discover and revisit what it already knows.
        props:
          title: Why this layer exists
          variant: note
  - id: quality
    title: System Quality Read
    layout: single-content
    transition: scale
    components:
      - type: radar-chart
        props:
          axes:
            - { label: Architecture }
            - { label: Registry coverage }
            - { label: Validation }
            - { label: Portability }
            - { label: Examples }
          datasets:
            - label: Phase 1 only
              color: '#b7a8b5'
              values: [62, 48, 40, 18, 35]
            - label: Current repo
              color: '#7a3f63'
              values: [91, 95, 88, 84, 90]
  - id: portability
    title: Portability Flow
    layout: full-bleed
    transition: wipe-left
    components:
      - type: sankey-diagram
        props:
          nodes:
            - { id: source, label: Source presentation }
            - { id: validate, label: Validate }
            - { id: package, label: Export package }
            - { id: import, label: Import target }
            - { id: promote, label: Promote reusable pieces }
          links:
            - { source: source, target: validate, value: 12 }
            - { source: validate, target: package, value: 10 }
            - { source: package, target: import, value: 8 }
            - { source: import, target: promote, value: 5 }
  - id: roadmap
    title: Roadmap Layers
    layout: pyramid-layout
    transition: scale-out
    components:
      - type: feature-card
        props:
          eyebrow: Base
          title: Runtime
        content: Stage machine, Map machine, renderers.
      - type: feature-card
        props:
          eyebrow: Layer
          title: Primitive libraries
        content: Components, layouts, transitions.
      - type: feature-card
        props:
          eyebrow: Layer
          title: Skills and validation
        content: Registries, schema, authoring guidance.
      - type: feature-card
        props:
          eyebrow: Surface
          title: Discovery and portability
        content: Dashboard UX, export/import, promotion.
      - type: feature-card
        props:
          eyebrow: Horizon
          title: Remaining partials
        content: Annotation UX, deeper polish, richer preview loops.
  - id: close
    title: Closing
    layout: stack
    transition: fade
    components:
      - type: icon
        props:
          name: sparkles
          size: xlarge
          color: 'var(--color-primary)'
      - type: divider
      - type: blockquote
        content: >-
          The goal is not to automate slide decks faster. The goal is to build
          a storytelling system that compounds quality, taste, and trust over time.
        props:
          attribution: Xtoryteller vision
      - type: footnote
        content: Use this deck as the sequential reference demo for architecture, workflow, and shipped surface area.
        props:
          label: Canonical use

