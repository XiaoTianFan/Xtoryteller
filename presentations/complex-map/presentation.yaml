meta:
  title: Xtoryteller Complex Map Demo
  slug: complex-map
  description: The canonical large Map presentation exploring Xtoryteller's system model, feature atlas, diagram library, and roadmap using spatial storytelling.
  author: Xtoryteller
  tags: [map, demo, canonical, complex, systems]
  createdAt: '2026-03-31'
  updatedAt: '2026-03-31'
mode: map
theme: xinimalist-dark
themeOverrides:
  colors:
    primary: '#8d4f2d'
    secondary: '#2a6c64'
background:
  type: paper
  colorStops:
    - 'rgba(var(--color-background-rgb), 0.96)'
    - 'rgba(var(--color-foreground-rgb), 0.10)'
    - 'rgba(var(--color-foreground-rgb), 0.18)'
backgroundSections:
  - match:
      group: vision
    shader:
      type: paper
      colorStops:
        - 'rgba(var(--color-background-rgb), 0.97)'
        - 'rgba(var(--color-foreground-rgb), 0.10)'
        - 'rgba(var(--color-foreground-rgb), 0.18)'
  - match:
      group: runtime
    shader:
      type: paper
      colorStops:
        - 'rgba(var(--color-background-rgb), 0.97)'
        - 'rgba(var(--color-foreground-rgb), 0.12)'
        - 'rgba(var(--color-foreground-rgb), 0.22)'
  - match:
      group: roadmap
    shader:
      type: paper
      colorStops:
        - 'rgba(var(--color-background-rgb), 0.97)'
        - 'rgba(var(--color-foreground-rgb), 0.14)'
        - 'rgba(var(--color-foreground-rgb), 0.20)'
canvas:
  spacing: 420
  initialZoom: 0.78
navigation:
  sequence:
    - north-star
    - philosophy
    - system-map
    - feedback-loops
    - authoring-flow
    - navigation-spectrum
    - architecture-depth
    - component-atlas
    - file-system-atlas
    - roadmap-bets
    - phase-horizons
    - quality-grid
    - quality-metrics
    - funnel-stakeholders
    - ecosystem-flow
    - release-timeline
    - roadmap-root
    - runtime-node
    - library-node
    - dashboard-node
    - validation-node
    - portability-node
clusters:
  - id: north-star
    title: North Star
    description: The product identity and the promise the rest of the map should reinforce.
    group: vision
    layout: title-center
    anchor: { x: 0, y: 0 }
    components:
      - type: headline
        content: A personal storytelling system
        props: { align: center }
      - type: subtitle
        content: Rich presentations composed from persistent infrastructure instead of generated from scratch every time.
        props: { align: center }
      - type: svg-graphic
        props:
          src: assets/hero.svg
          alt: Xtoryteller map-mode hero illustration
  - id: philosophy
    title: Philosophy
    description: The governing ideas behind the platform.
    group: vision
    layout: sidebar-main
    anchor:
      relativeTo: north-star
      direction: right
      distance: 700
    components:
      - type: callout
        content: Infrastructure over generation is the core bet. The agent should reason from a durable system, not improvise a fresh one-off UI every time.
        props:
          title: Central bet
          variant: important
      - type: bullet-list
        props:
          items:
            - Self-hosted and file-system-first.
            - Agent-facing documentation and registries.
            - Browser-native rendering with dual navigation modes.
            - Portability, validation, and iteration as first-class concerns.
  - id: system-map
    title: System Map
    description: The major surfaces that make the product coherent.
    group: vision
    layout: single-content
    anchor:
      relativeTo: north-star
      direction: below
      distance: 540
    components:
      - type: mind-map
        props:
          root: { label: Xtoryteller }
          branches:
            - label: Presentations
            - label: Primitive libraries
            - label: Themes
            - label: Skills
            - label: Validation
            - label: Dashboard
            - label: Portability
  - id: feedback-loops
    title: Feedback Loops
    description: Why the system compounds over time.
    group: runtime
    layout: single-content
    anchor:
      relativeTo: system-map
      direction: right
      distance: 760
    components:
      - type: causal-diagram
        props:
          variables:
            - { id: registry, label: Registry depth }
            - { id: agent, label: Agent confidence }
            - { id: quality, label: Presentation quality }
            - { id: reuse, label: Primitive reuse }
          edges:
            - { from: registry, to: agent, polarity: '+' }
            - { from: agent, to: quality, polarity: '+' }
            - { from: quality, to: reuse, polarity: '+' }
            - { from: reuse, to: registry, polarity: '+' }
  - id: authoring-flow
    title: Authoring Flow
    description: How intent becomes a presentation artifact.
    group: runtime
    layout: single-content
    anchor:
      relativeTo: philosophy
      direction: right
      distance: 760
    components:
      - type: flowchart
        props:
          nodes:
            - { id: intent, label: User intent, type: start }
            - { id: scan, label: Read skills and registries, type: action }
            - { id: compose, label: Compose YAML, type: action }
            - { id: validate, label: Validate and warn, type: decision }
            - { id: render, label: Render and review, type: end }
          edges:
            - { from: intent, to: scan }
            - { from: scan, to: compose }
            - { from: compose, to: validate }
            - { from: validate, to: render }
  - id: navigation-spectrum
    title: Navigation Spectrum
    description: Stage and Map are related, not competing, presentation modes.
    group: runtime
    layout: two-column
    anchor:
      relativeTo: philosophy
      direction: below
      distance: 540
    components:
      - type: spectrum-bar
        props:
          leftLabel: Sequential
          rightLabel: Spatial
          markers:
            - { label: Pitch, position: 0.14 }
            - { label: Demo, position: 0.32 }
            - { label: Architecture review, position: 0.66 }
            - { label: Workshop map, position: 0.88 }
      - type: venn-diagram
        props:
          sets:
            - { label: Storytelling, color: '#8d4f2d' }
            - { label: Infrastructure, color: '#2a6c64' }
            - { label: Agent skill surface, color: '#7a3f63' }
          intersections:
            - { label: Xtoryteller runtime }
  - id: architecture-depth
    title: Architecture Depth
    description: What sits below the visible presentation surface.
    group: runtime
    layout: content-left-media-right
    anchor:
      relativeTo: feedback-loops
      direction: below
      distance: 560
    components:
      - type: body-text
        content: |
          The visible presentation is only the top layer. Under it sit the
          theme resolver, registries, YAML loader, asset resolution, template
          engine, XState-driven runtime behavior, and the authoring skill
          system that helps agents stay within the shipped surface.
      - type: iceberg-diagram
        props:
          layers:
            - { depth: surface, label: Surface, items: ['Slides', 'Clusters', 'Transitions'] }
            - { depth: patterns, label: Patterns, items: ['Layouts', 'Themes', 'Diagram vocabulary'] }
            - { depth: structures, label: Structures, items: ['Schema', 'Registries', 'Validation'] }
            - { depth: mental-models, label: Mental models, items: ['Infrastructure over generation', 'Agent-first authoring'] }
  - id: component-atlas
    title: Component Atlas
    description: A compact gallery of important built-in surfaces.
    group: runtime
    layout: gallery
    anchor:
      relativeTo: feedback-loops
      direction: right
      distance: 760
    components:
      - type: feature-card
        content: Typography, lists, callouts, quotes, and code blocks handle the editorial core.
        props:
          eyebrow: Content
          title: Narrative primitives
          icon: type
      - type: feature-card
        content: Cards, profile surfaces, stats, and comparisons make summaries legible and reusable.
        props:
          eyebrow: Cards
          title: Framing primitives
          icon: panels-top-left
      - type: feature-card
        content: Flow, causal, map, chart, and metaphor diagrams let the browser do more than imitate slides.
        props:
          eyebrow: Diagrams
          title: Structured meaning
          icon: waypoints
      - type: feature-card
        content: Images, SVG graphics, videos, and iframes broaden what can appear inside a presentation.
        props:
          eyebrow: Media
          title: Rich embeds
          icon: image
      - type: feature-card
        content: Theme tokens keep the whole system coherent without hardcoded colors or typography everywhere.
        props:
          eyebrow: Theme
          title: Consistent styling
          icon: palette
      - type: feature-card
        content: Validation protects the user from typos, missing assets, broken anchors, and overloaded layouts.
        props:
          eyebrow: Safety
          title: Trusted authoring
          icon: shield-check
  - id: file-system-atlas
    title: File-System Atlas
    description: The repo structure as a map of responsibilities.
    group: runtime
    layout: scattered
    anchor:
      relativeTo: navigation-spectrum
      direction: below
      distance: 580
    components:
      - type: card
        content: Presentation YAML, local assets, and the user-facing story artifacts.
        position: { x: 0.22, y: 0.28 }
        props:
          header: presentations/
          variant: elevated
      - type: card
        content: Reusable components, layouts, and transitions that make the agent's work cumulative.
        position: { x: 0.68, y: 0.22 }
        props:
          header: components/ + layouts/ + transitions/
          variant: elevated
      - type: card
        content: Engine, loaders, runtime providers, machines, and renderers.
        position: { x: 0.28, y: 0.72 }
        props:
          header: lib/ + app/
          variant: elevated
      - type: card
        content: Registries, schema, authoring guidance, and workflow phases for coding agents.
        position: { x: 0.74, y: 0.72 }
        props:
          header: skills/ + docs/ + scripts/
          variant: elevated
  - id: roadmap-bets
    title: Opportunity Space
    description: Where the most meaningful future bets sit.
    group: roadmap
    layout: single-content
    anchor:
      relativeTo: file-system-atlas
      direction: right
      distance: 760
    components:
      - type: quadrant-chart
        props:
          xAxis: { label: Effort, low: Lower, high: Higher }
          yAxis: { label: Strategic leverage, low: Lower, high: Higher }
          items:
            - { label: Annotation UX, x: 0.42, y: 0.52 }
            - { label: Preview self-correction loop, x: 0.64, y: 0.80 }
            - { label: More portability polish, x: 0.56, y: 0.74 }
            - { label: Analytics and branch logic, x: 0.84, y: 0.46 }
  - id: phase-horizons
    title: Three Horizons
    description: How the project has evolved and where it can keep growing.
    group: roadmap
    layout: single-content
    anchor:
      relativeTo: roadmap-bets
      direction: below
      distance: 560
    components:
      - type: three-horizons
        props:
          horizon1:
            label: Foundation
            items: [Stage runtime, YAML loader, registries, default theme]
          horizon2:
            label: Expansion
            items: [Map mode, diagram suite, dashboard controls, richer layouts]
          horizon3:
            label: Portable system
            items: [Export/import, promotion, stronger preview loops, future polish]
          timeLabels:
            start: Phase 1
            mid: Phase 2-3
            end: Next horizon
  - id: quality-grid
    title: Quality Signals
    description: What the repo now surfaces clearly to agents and humans.
    group: roadmap
    layout: grid-2x2
    anchor:
      relativeTo: phase-horizons
      direction: right
      distance: 760
    components:
      - type: stat-card
        props:
          label: Validation checks
          value: Many
          detail: Schema, assets, ids, anchors, navigation integrity, density guidance.
      - type: stat-card
        props:
          label: Registry freshness
          value: Automatic
          detail: Shared tooling refreshes agent references as manifests and themes change.
      - type: stat-card
        props:
          label: Example coverage
          value: 4 demos
          detail: Canonical simple and complex examples for both Stage and Map modes.
      - type: stat-card
        props:
          label: Partial areas
          value: Few
          detail: Annotation UX and some animation semantics still merit manual verification.
  - id: quality-metrics
    title: Quality Metrics
    description: A more visual read on maturity and coverage.
    group: roadmap
    layout: two-column
    anchor:
      relativeTo: quality-grid
      direction: below
      distance: 560
    components:
      - type: radar-chart
        props:
          axes:
            - { label: Breadth }
            - { label: Runtime fit }
            - { label: Registry coverage }
            - { label: Examples }
            - { label: Portability }
          datasets:
            - label: Before expansion
              color: '#94a3b8'
              values: [46, 58, 52, 35, 18]
            - label: Current repo
              color: '#2a6c64'
              values: [92, 88, 95, 90, 84]
      - type: coordinate-plot
        props:
          xAxis: { label: Trust in output, min: 0, max: 100 }
          yAxis: { label: Authoring range, min: 0, max: 100 }
          points:
            - { label: Stage foundation, x: 72, y: 64, radius: 18 }
            - { label: Map runtime, x: 81, y: 78, radius: 20 }
            - { label: Diagram suite, x: 89, y: 86, radius: 24, color: '#8d4f2d' }
            - { label: Portability, x: 84, y: 82, radius: 22, color: '#7a3f63' }
  - id: funnel-stakeholders
    title: Delivery Funnel And Stakeholders
    description: The audience and delivery path around a portable presentation system.
    group: roadmap
    layout: top-bottom
    layoutProps:
      ratio: 55-45
    anchor:
      relativeTo: component-atlas
      direction: below
      distance: 600
    components:
      - type: funnel-diagram
        props:
          stages:
            - { label: Intent, value: 1 conversation }
            - { label: Structured content, value: 1 YAML file }
            - { label: Validated artifact, value: 1 working presentation }
            - { label: Portable package, value: 1 transferable bundle }
      - type: stakeholder-map
        props:
          center: Xtoryteller instance
          rings:
            - label: Immediate users
              stakeholders:
                - { label: Author }
                - { label: Presenter, angle: 180 }
            - label: Operational partners
              stakeholders:
                - { label: Reviewer, angle: 40 }
                - { label: Skill system, angle: 190 }
                - { label: CI build, angle: 320 }
  - id: ecosystem-flow
    title: Ecosystem Flow
    description: Where value moves when a presentation becomes portable and reusable.
    group: roadmap
    layout: full-bleed
    anchor:
      relativeTo: funnel-stakeholders
      direction: right
      distance: 760
    components:
      - type: sankey-diagram
        props:
          nodes:
            - { id: author, label: Authoring }
            - { id: validate, label: Validate }
            - { id: package, label: Package }
            - { id: import, label: Import }
            - { id: reuse, label: Reuse }
          links:
            - { source: author, target: validate, value: 12 }
            - { source: validate, target: package, value: 10 }
            - { source: package, target: import, value: 8 }
            - { source: import, target: reuse, value: 7 }
  - id: release-timeline
    title: Release Timeline
    description: The current implementation story at a glance.
    group: roadmap
    layout: single-content
    anchor:
      relativeTo: ecosystem-flow
      direction: below
      distance: 560
    components:
      - type: timeline
        props:
          orientation: vertical
          events:
            - { date: Phase 1, title: Foundation, description: Stage runtime, YAML loader, core components, dashboard entry flow. }
            - { date: Phase 2, title: Spatial storytelling, description: Map mode, cluster arrangement, first diagram wave, guided navigation. }
            - { date: Phase 3, title: Expansion, description: Richer layouts, fuller component suite, discovery UX, portability scripts. }
            - { date: Today, title: Consolidated demos, description: Four canonical examples now serve as the reference surface for the repo. }
  - id: roadmap-root
    title: Canonical Delivery Tree
    description: Keep the example set lean while still exercising the full system.
    group: roadmap
    layout: title-center
    anchor:
      relativeTo: phase-horizons
      direction: below
      distance: 700
    arrangement:
      algorithm: tree
      spacing: 280
    components:
      - type: label
        content: Demo strategy
      - type: headline
        content: Four canonical presentations
        props: { align: center }
      - type: subtitle
        content: Simple Stage, Simple Map, Complex Stage, and Complex Map absorb the one-off showcases.
        props: { align: center }
  - id: runtime-node
    title: Runtime
    description: Strengthen the runtime before inventing new surface area.
    group: roadmap
    layout: single-content
    anchor:
      relativeTo: roadmap-root
    components:
      - type: bullet-list
        props:
          items:
            - Stage and Map behaviors remain the backbone of the system.
            - Background sections, guided paths, and renderers should stay exercised by real demos.
  - id: library-node
    title: Library
    description: Keep the default primitives visible and testable.
    group: roadmap
    layout: single-content
    anchor:
      relativeTo: roadmap-root
    components:
      - type: bullet-list
        props:
          items:
            - Reuse built-in components and layouts before adding bespoke ones.
            - Let the complex demos act as living visual reference material.
  - id: dashboard-node
    title: Dashboard
    description: The growing library must stay discoverable.
    group: roadmap
    layout: single-content
    anchor:
      relativeTo: roadmap-root
    components:
      - type: bullet-list
        props:
          items:
            - Search across titles, tags, descriptions, and component text.
            - Keep the presentation set intentional so the dashboard remains signal-rich.
  - id: validation-node
    title: Validation
    description: Guardrails make agent output more trustworthy.
    group: roadmap
    layout: single-content
    anchor:
      relativeTo: roadmap-root
    components:
      - type: bullet-list
        props:
          items:
            - Catch broken references, missing assets, build gaps, and anchor mistakes early.
            - Use density warnings to prevent crammed examples from becoming the norm.
  - id: portability-node
    title: Portability
    description: Presentations should travel with their useful dependencies.
    group: roadmap
    layout: single-content
    anchor:
      relativeTo: roadmap-root
    components:
      - type: callout
        content: Export, import, and promotion are part of the platform story, not side scripts. The demos should keep reminding users that ownership and reuse matter here.
        props:
          title: Keep this visible
          variant: tip

