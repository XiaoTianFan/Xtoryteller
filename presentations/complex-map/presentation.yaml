meta:
  title: Complex Map Example
  slug: complex-map
  description: A richer Map presentation with multiple diagram clusters and arrangement-oriented composition.
  author: Xtoryteller
  tags: [map, complex, strategy]
  createdAt: 2026-03-31
  updatedAt: 2026-03-31
mode: map
theme: default
background:
  type: paper
  colorStops:
    - 'rgba(250, 245, 239, 0.96)'
    - 'rgba(216, 154, 79, 0.18)'
    - 'rgba(42, 108, 100, 0.16)'
backgroundSections:
  - match:
      group: strategy
    shader:
      type: paper
      colorStops:
        - 'rgba(249, 243, 236, 0.96)'
        - 'rgba(141, 79, 45, 0.22)'
        - 'rgba(31, 106, 122, 0.18)'
canvas:
  spacing: 420
  initialZoom: 0.8
navigation:
  sequence: [north-star, system-map, opportunity-space, transformation-flow]
clusters:
  - id: north-star
    title: North Star
    description: The desired user experience and product identity.
    group: strategy
    layout: title-center
    anchor: { x: 0, y: 0 }
    components:
      - type: headline
        content: A personal storytelling system
        props: { align: center }
      - type: subtitle
        content: Each presentation should reinforce a durable design language.
        props: { align: center }
  - id: system-map
    title: System Map
    description: Core feedback loops behind the product thesis.
    group: strategy
    layout: single-content
    anchor:
      relativeTo: north-star
      direction: right
      distance: 700
    components:
      - type: mind-map
        props:
          root: { label: Xtoryteller }
          branches:
            - label: Agent interface
            - label: Persistent primitives
            - label: Portable artifacts
            - label: Browser runtime
  - id: opportunity-space
    title: Opportunity Space
    description: Position the roadmap bets.
    group: roadmap
    layout: single-content
    anchor:
      relativeTo: north-star
      direction: below
      distance: 520
    components:
      - type: quadrant-chart
        props:
          xAxis: { label: Effort, low: Lower, high: Higher }
          yAxis: { label: Strategic leverage, low: Lower, high: Higher }
          items:
            - { label: More components, x: 0.68, y: 0.62 }
            - { label: Export/import, x: 0.54, y: 0.74 }
            - { label: Style previews, x: 0.42, y: 0.58 }
            - { label: Analytics, x: 0.77, y: 0.44 }
  - id: transformation-flow
    title: Transformation Flow
    description: How raw user intent becomes a presentation artifact.
    group: runtime
    layout: single-content
    anchor:
      relativeTo: opportunity-space
      direction: right
      distance: 700
    components:
      - type: flowchart
        props:
          nodes:
            - { id: input, label: User intent, type: start }
            - { id: scan, label: Scan registries, type: action }
            - { id: compose, label: Compose YAML, type: action }
            - { id: validate, label: Validate, type: decision }
            - { id: render, label: Render runtime, type: end }
          edges:
            - { from: input, to: scan }
            - { from: scan, to: compose }
            - { from: compose, to: validate }
            - { from: validate, to: render }
  - id: hidden-depth
    title: Hidden Depth
    description: What sits below the visible presentation layer.
    group: runtime
    layout: single-content
    anchor:
      relativeTo: system-map
      direction: below
      distance: 520
    components:
      - type: iceberg-diagram
        props:
          layers:
            - { depth: surface, label: Surface, items: ['Slides', 'Transitions'] }
            - { depth: patterns, label: Patterns, items: ['Themes', 'Layouts'] }
            - { depth: structures, label: Structures, items: ['Schema', 'Registries'] }
            - { depth: mental-models, label: Mental models, items: ['Infrastructure over generation'] }
