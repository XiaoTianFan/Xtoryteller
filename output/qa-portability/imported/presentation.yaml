meta:
  title: Xtoryteller Simple Stage Demo
  slug: simple-stage
  description: A compact canonical Stage presentation introducing Xtoryteller's philosophy, workflow, and core value.
  author: Xtoryteller
  tags: [stage, demo, canonical, overview]
  createdAt: '2026-03-31'
  updatedAt: '2026-03-31'
mode: stage
theme: xinimalist-paper
background:
  type: paper
  colorStops:
    - 'rgba(247, 242, 234, 0.96)'
    - 'rgba(42, 108, 100, 0.18)'
    - 'rgba(141, 79, 45, 0.18)'
steps:
  - id: intro
    title: Opening
    layout: title-center
    transition: fade
    components:
      - type: headline
        content: Xtoryteller
        props: { level: 1, align: center }
      - type: subtitle
        content: Agent-first presentation infrastructure for Stage and Map storytelling.
        props: { align: center }
      - type: image
        props:
          src: assets/hero.svg
          alt: Abstract hero illustration
          caption: YAML orchestration on top of reusable components, layouts, themes, and transitions.
  - id: philosophy
    title: Philosophy
    layout: two-column
    layoutProps:
      ratio: 60-40
    transition: slide-left
    components:
      - type: body-text
        content: |
          Xtoryteller treats the presentation system itself as the product.
          Agents do not regenerate disposable slide HTML from scratch. They
          compose from durable infrastructure that keeps getting better:
          components, layouts, transitions, themes, validation, and skills.
      - type: bullet-list
        build: sequential
        props:
          items:
            - Human directs the story, the agent orchestrates the files, and the browser renders the result.
            - YAML stays diffable, reviewable, and easy to validate.
            - Each new primitive compounds future presentation quality instead of being a one-off artifact.
  - id: workflow
    title: Workflow
    layout: content-left-media-right
    transition: slide-up
    components:
      - type: numbered-list
        props:
          items:
            - Scan the registries and examples.
            - Pick Stage or Map based on the story shape.
            - Author `presentation.yaml` with built-in primitives first.
            - Validate, preview, and iterate in the browser.
      - type: code-block
        props:
          filename: presentation.yaml
          language: yaml
        content: |
          mode: stage
          theme: xinimalist-paper
          steps:
            - layout: single-content
              transition: fade
              components:
                - type: headline
                  content: Hello Xtoryteller
  - id: highlights
    title: Highlights
    layout: three-column
    transition: slide-left
    components:
      - type: feature-card
        content: Reusable components and layouts give agents a dependable design surface.
        props:
          eyebrow: Infrastructure
          title: Compose, do not regenerate
          icon: layers-3
      - type: feature-card
        content: Stage mode supports paced, sequential storytelling with transitions and build steps.
        props:
          eyebrow: Runtime
          title: Guided narrative
          icon: presentation
      - type: feature-card
        content: Map mode turns related ideas into clusters that can be explored spatially or in sequence.
        props:
          eyebrow: Runtime
          title: Exploratory systems view
          icon: map
  - id: close
    title: Closing
    layout: single-content
    transition: scale
    components:
      - type: blockquote
        content: >-
          Every presentation created should make the next one easier,
          cleaner, more personal, and more trustworthy.
        props:
          attribution: Xtoryteller philosophy

