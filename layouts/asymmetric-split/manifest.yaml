name: asymmetric-split
displayName: Asymmetric Split
description: Ratio-driven editorial split with optional anchored ornament.
slots: [main, support, ornament]
props:
  ratio:
    type: enum
    values: [60-40, 40-60, 70-30, 30-70]
    default: 60-40
    description: Main-to-support panel ratio.
  ornamentAnchor:
    type: enum
    values: [top-left, top-right, bottom-left, bottom-right]
    default: top-right
    description: Corner for the optional ornament panel.
density:
  recommendation: One dominant narrative panel, one support panel, and one small decorative accent.
