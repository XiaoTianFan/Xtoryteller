name: Xinimalist Paper
fonts:
  heading:
    family: 'EB Garamond'
    source: google
    weights: [400, 500, 600, 700]
    styles: [normal, italic]
    display: swap
    fallbacks: ['Georgia', 'serif']
  body:
    family: 'General Sans'
    source: fontshare
    cssUrl: 'https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap'
    fallbacks:
      [
        'Inter',
        '-apple-system',
        'BlinkMacSystemFont',
        '"Segoe UI"',
        'sans-serif',
      ]
  mono:
    family: 'Geist Mono'
    source: google
    weights: [400, 500, 700]
    styles: [normal]
    display: swap
    fallbacks: ['Consolas', 'monospace']
colors:
  background: '#f5f2e3'
  surface: '#f8f5ea'
  panel: '#ebe4d2'
  foreground: '#22211a'
  muted: '#5c5749'
  border: 'rgba(34, 33, 26, 0.18)'
  primary: '#8b5a2b'
  secondary: '#3a3124'
  accent: '#3b82f6'
  success: '#2f7a57'
  warning: '#b86a20'
  error: '#a53a3a'
  overlay: 'rgba(245, 242, 227, 0.88)'
  'background-rgb': '245, 242, 227'
  'foreground-rgb': '34, 33, 26'
  chrome:
    'page-glow': 'rgba(34, 33, 26, 0.08)'
    'page-top': '#f7f4e8'
    'page-bottom': '#ebe4d2'
    surface: 'rgba(245, 242, 227, 0.76)'
    'surface-strong': 'rgba(245, 242, 227, 0.9)'
    'surface-active': 'rgba(245, 242, 227, 0.96)'
    'surface-float': 'rgba(245, 242, 227, 0.84)'
    'overlay-surface': 'rgba(245, 242, 227, 0.95)'
    border: 'rgba(34, 33, 26, 0.16)'
    'border-strong': 'rgba(34, 33, 26, 0.28)'
    text: '#22211a'
    'text-muted': '#6f695b'
    'text-soft': '#5c5749'
    'badge-bg': 'rgba(34, 33, 26, 0.06)'
    'badge-border': 'rgba(34, 33, 26, 0.14)'
    'badge-text': '#3a3124'
    'accent-start': 'rgba(34, 33, 26, 0.08)'
    'accent-end': 'rgba(139, 90, 43, 0.16)'
    'thumbnail-start': 'rgba(34, 33, 26, 0.88)'
    'thumbnail-end': 'rgba(139, 90, 43, 0.74)'
    'thumbnail-text': '#f5f2e3'
    'focus-ring': 'rgba(34, 33, 26, 0.18)'
    'panel-shadow': '0 -8px 24px rgba(0, 0, 0, 0.16)'
    'float-shadow': '0 4px 12px rgba(0, 0, 0, 0.12)'
    'overlay-shadow': '0 12px 30px rgba(0, 0, 0, 0.16)'
    'button-blur': '2px'
    'panel-blur': '18px'
    'float-blur': '12px'
    'overlay-blur': '14px'
    'noise-opacity': '0.045'
    'noise-strength': '0.22'
  code:
    bg: '#1d1b19'
    foreground: '#f5f2e3'
    'header-bg': 'rgba(255, 255, 255, 0.06)'
  scrollbar:
    thumb: '#22211a'
    'thumb-muted': 'rgba(34, 33, 26, 0.72)'
    track: 'transparent'
    border: '#f5f2e3'
  progress:
    track: 'rgba(34, 33, 26, 0.12)'
    start: '#22211a'
    end: '#8b5a2b'
  'overlay-scrim': 'rgba(20, 17, 12, 0.42)'
  diagram:
    'series-1': '#8b5a2b'
    'series-2': '#3a3124'
    'series-3': '#3b82f6'
  'error-surface': 'rgba(165, 58, 58, 0.08)'
  'error-border': 'rgba(165, 58, 58, 0.24)'
  backgroundStops:
    default:
      - 'rgba(var(--color-background-rgb), 0.96)'
      - 'rgba(var(--color-foreground-rgb), 0.12)'
      - 'rgba(var(--color-foreground-rgb), 0.18)'
typography:
  h1: 'clamp(2.6rem, 4vw, 4.8rem)'
  h2: 'clamp(2rem, 3vw, 3.2rem)'
  h3: 'clamp(1.45rem, 2vw, 2rem)'
  body: 'clamp(1rem, 1.2vw, 1.12rem)'
  small: 'clamp(0.82rem, 1vw, 0.94rem)'
  lead: 'clamp(1.1rem, 1.5vw, 1.32rem)'
  code: 'clamp(0.88rem, 1vw, 0.98rem)'
  components:
    shell:
      eyebrow: '0.8rem'
      hero: 'clamp(2.5rem, 5vw, 5rem)'
      lead: 'clamp(1rem, 1.5vw, 1.2rem)'
      meta: '0.92rem'
      'card-title': '1.5rem'
      chip: '0.85rem'
      thumbnail: '2rem'
      'cluster-title': '0.95rem'
      'shortcut-key': '0.9rem'
    feature:
      title: 'clamp(1.2rem, 2vw, 1.6rem)'
    stat:
      value: 'clamp(2rem, 4vw, 3.2rem)'
    comparison:
      divider: 'clamp(1.2rem, 2vw, 1.8rem)'
    diagram:
      label: '14px'
spacing:
  page: 'clamp(1.4rem, 3vw, 3rem)'
  section: 'clamp(1.1rem, 2vw, 1.9rem)'
  gap: 'clamp(0.8rem, 1.3vw, 1.3rem)'
  cluster: 'clamp(0.9rem, 1.4vw, 1.4rem)'
  chrome:
    'page-padding': 'clamp(1.5rem, 4vw, 3rem)'
    'hero-gap': '2rem'
    'tools-gap': '0.85rem'
    'control-height': '3rem'
    'control-padding-y': '0.85rem'
    'control-padding-x': '1rem'
    'control-padding-inline-end': '3rem'
    'toggle-gap': '0.3rem'
    'toggle-padding': '0.3rem'
    'toggle-button-padding-y': '0.65rem'
    'toggle-button-padding-x': '0.95rem'
    'card-grid-gap': '1.25rem'
    'card-media-height': '180px'
    'card-padding': '1.1rem'
    'card-gap': '0.8rem'
    'row-gap': '0.7rem'
    'chip-gap': '0.35rem'
    'chip-padding-y': '0.35rem'
    'chip-padding-x': '0.7rem'
    'button-padding-y': '0.7rem'
    'button-padding-x': '1rem'
    'dock-progress-height': '0.45rem'
    'dock-hover-zone': '1.1rem'
    'dock-open-height': '28rem'
    'dock-panel-gap': '0.85rem'
    'dock-panel-padding-y': '0.95rem'
    'dock-panel-padding-x': '1rem'
    'dock-panel-padding-bottom': '1rem'
    'dock-row-gap': '0.85rem'
    'dock-row-gap-inline': '1rem'
    'cluster-header-offset': '2.8rem'
    'cluster-header-gap': '0.5rem'
    'cluster-header-padding-y': '0.4rem'
    'cluster-header-padding-x': '0.65rem'
    'cluster-sequence-padding-bottom': '0.25rem'
    'empty-page-padding': '2rem'
    'empty-panel-padding': '2rem'
    'overlay-padding': '1.5rem'
    'overlay-panel-gap': '1rem'
    'overlay-panel-padding': '1.2rem'
    'overlay-header-gap': '1rem'
    'overlay-title-gap': '0.2rem'
    'overlay-section-gap': '0.65rem'
    'overlay-row-gap': '0.8rem'
    'overlay-key-padding-y': '0.35rem'
    'overlay-key-padding-x': '0.5rem'
  components:
    card:
      padding: 'clamp(1rem, 2vw, 1.5rem)'
      gap: '0.7rem'
      'title-gap': '0.65rem'
      'footer-gap': '0.9rem'
    feature:
      gap: '0.7rem'
      'header-gap': '0.8rem'
      'headline-gap': '0.2rem'
      'list-gap': '0.45rem'
    profile:
      gap: '1rem'
      'header-gap': '0.9rem'
      'meta-gap': '0.2rem'
    stat:
      gap: '0.45rem'
      'trend-gap': '0.45rem'
    comparison:
      gap: '0.8rem'
      'columns-gap': '1rem'
    callout:
      padding: 'clamp(1rem, 2vw, 1.5rem)'
      'title-gap': '0.4rem'
    list:
      gap: '0.7rem'
      'padding-start': '1.2rem'
      'numbered-padding-start': '1.4rem'
    quote:
      padding: 'clamp(1rem, 2vw, 1.6rem)'
      'caption-gap': '1rem'
    footnote:
      gap: '0.45rem'
      'padding-top': '0.75rem'
    label:
      'padding-y': '0.35rem'
      'padding-x': '0.8rem'
    code:
      'header-padding-y': '0.7rem'
      'header-padding-x': '1rem'
      'body-padding': '1rem'
    timeline:
      gap: '1rem'
      'item-gap': '0.9rem'
      'item-padding': '1rem'
      'body-gap': '0.35rem'
      'event-gap': '0.35rem'
      'event-padding': '1rem'
    annotation:
      'focus-outline-offset': '0.18rem'
      'popover-offset': '0.65rem'
      'popover-padding-y': '0.7rem'
      'popover-padding-x': '0.85rem'
    media:
      'figure-gap': '0.75rem'
      'caption-gap': '0.75rem'
    spectrum:
      gap: '0.8rem'
      'marker-gap': '0.35rem'
      'legend-gap': '1rem'
    horizons:
      gap: '1rem'
      'columns-gap': '1rem'
      'column-padding': '0.9rem'
      'list-padding-start': '1.1rem'
      'list-gap': '0.35rem'
    diagram:
      'caption-gap': '0.75rem'
  layouts:
    compact:
      padding: 'clamp(0.85rem, 1.4vw, 1.15rem)'
      gap: 'clamp(0.5rem, 1vw, 0.85rem)'
    timeline:
      gap: 'clamp(1.1rem, 2vw, 1.9rem)'
      'track-offset': '1.2rem'
    comparison:
      'arrow-gap': 'clamp(1.2rem, 2vw, 1.8rem)'
    pyramid:
      gap: 'clamp(0.45rem, 0.8vw, 0.8rem)'
sizing:
  components:
    shell:
      'hero-max-width': '60rem'
      'lead-max-width': '48rem'
      'empty-panel-max-width': '34rem'
      'filter-min-width': '160px'
      'filter-max-width': '220px'
      'card-grid-min-width': '260px'
      'list-media-min-width': '220px'
      'list-media-max-width': '320px'
      'shortcut-panel-width': '32rem'
      'shortcut-panel-max-height': '42rem'
      'shortcut-key-min-width': '7.5rem'
      'shortcut-key-max-width': '10rem'
      scrollbar: '6px'
    feature:
      icon: '2.4rem'
      'icon-padding': '0.55rem'
    profile:
      avatar: '4rem'
    stat:
      'trend-icon': '1rem'
    timeline:
      marker: '2.25rem'
      dot: '0.7rem'
      icon: '1rem'
      'event-dot': '2rem'
    annotation:
      'popover-width': '20rem'
      arrow: '0.8rem'
    media:
      'image-max-height': '420px'
      'iframe-min-height': '320px'
    spectrum:
      'figure-min-height': '15rem'
      'bar-min-height': '5rem'
      dot: '0.9rem'
      'vertical-bar-width': '1.1rem'
      'vertical-min-height': '18rem'
  layouts:
    'title-left-accent-min-width': '220px'
    'section-header-accent-max-width': '14rem'
    'single-content-max-width': '78rem'
    'content-media-min-width': '280px'
    'sidebar-main-min-width': '220px'
    'gallery-item-min-width': '220px'
    'scattered-item-width': '320px'
    'timeline-item-min-width': '180px'
    'comparison-divider-min-width': '4rem'
    'comparison-divider-badge-size': '3rem'
    'pyramid-max-width': '52rem'
    'pyramid-top-width': '18rem'
    'pyramid-middle-width': '28rem'
    'pyramid-base-width': '38rem'
radii:
  small: '0'
  medium: '0'
  large: '0'
  pill: '999px'
  code: '10px'
  scrollbar: '3px'
  chrome:
    control: '0'
    card: '0'
    chip: '0'
    panel: '0'
    overlay: '0'
  components:
    card: '0'
    callout: '0'
    label: '0'
    code: '10px'
    tooltip: '0'
    media: '0'
    avatar: '999px'
    marker: '999px'
    spectrum: '999px'
  layouts:
    'divider-badge': '999px'
shadows:
  soft: '0 4px 12px rgba(0, 0, 0, 0.12)'
  strong: '0 10px 24px rgba(0, 0, 0, 0.16)'
  chrome:
    card: '0 24px 80px rgba(61, 43, 24, 0.08)'
    panel: '0 -8px 24px rgba(0, 0, 0, 0.16)'
    overlay: '0 28px 80px rgba(44, 30, 15, 0.18)'
    float: '0 4px 12px rgba(0, 0, 0, 0.12)'
  components:
    card: '0 4px 12px rgba(0, 0, 0, 0.12)'
    code: '0 10px 24px rgba(0, 0, 0, 0.16)'
    tooltip: '0 4px 12px rgba(0, 0, 0, 0.12)'
borders:
  subtle: '1px solid rgba(34, 33, 26, 0.14)'
  strong: '1px solid rgba(34, 33, 26, 0.28)'
  chrome:
    control: '1px solid rgba(34, 33, 26, 0.14)'
    card: '1px solid rgba(34, 33, 26, 0.14)'
    chip: '1px solid rgba(34, 33, 26, 0.14)'
    panel: '1px solid rgba(34, 33, 26, 0.14)'
    overlay: '1px solid rgba(34, 33, 26, 0.18)'
  components:
    card: '1px solid rgba(34, 33, 26, 0.14)'
    callout: '1px solid rgba(34, 33, 26, 0.14)'
    label: '1px solid rgba(34, 33, 26, 0.14)'
    code: '1px solid rgba(34, 33, 26, 0.14)'
    tooltip: '1px solid rgba(34, 33, 26, 0.28)'
motion:
  fast: '180ms'
  normal: '360ms'
  slow: '700ms'
  easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
  scene:
    duration: '500ms'
    easing: 'cubic-bezier(0.6, 0.01, 0.05, 0.9)'
  reveal:
    duration: '500ms'
    easing: 'cubic-bezier(0.6, 0.01, 0.05, 0.9)'
    'delay-step': '100ms'
    'offset-y': 20
    'initial-opacity': 0
  panel:
    duration: '300ms'
    easing: 'ease-in-out'
    'offset-y': '0.8rem'
  hover:
    duration: '200ms'
    easing: 'ease-out'
    scale: 1.02
    rise: '0px'
  components:
    list:
      'offset-y': '0.35rem'
    timeline:
      'offset-y': '0.4rem'
