typography:
  h1: clamp(2.7rem, 4.8vw, 5.1rem)
  h2: clamp(2rem, 3vw, 3.2rem)
  h3: clamp(1.35rem, 2vw, 1.95rem)
  body: clamp(1rem, 1.15vw, 1.1rem)
  small: clamp(0.8rem, 0.95vw, 0.92rem)
  lead: clamp(1.1rem, 1.5vw, 1.3rem)
  code: clamp(0.88rem, 1vw, 0.98rem)
  components:
    shell:
      eyebrow: 0.8rem
      hero: clamp(2.5rem, 5vw, 5rem)
      lead: clamp(1rem, 1.5vw, 1.2rem)
      meta: 0.92rem
      card-title: 1.5rem
      chip: 0.85rem
      thumbnail: 2rem
      cluster-title: 0.95rem
      shortcut-key: 0.9rem
    feature:
      title: clamp(1.2rem, 2vw, 1.6rem)
    stat:
      value: clamp(2rem, 4vw, 3.2rem)
    comparison:
      divider: clamp(1.2rem, 2vw, 1.8rem)
    diagram:
      label: 14px
spacing:
  page: clamp(1.5rem, 3vw, 3rem)
  section: clamp(1rem, 1.8vw, 1.7rem)
  gap: clamp(0.82rem, 1.3vw, 1.18rem)
  cluster: clamp(0.9rem, 1.4vw, 1.4rem)
  chrome:
    page-padding: clamp(1.5rem, 4vw, 3rem)
    hero-gap: 2rem
    tools-gap: 0.85rem
    control-height: 3rem
    control-padding-y: 0.85rem
    control-padding-x: 1rem
    control-padding-inline-end: 3rem
    toggle-gap: 0.3rem
    toggle-padding: 0.3rem
    toggle-button-padding-y: 0.65rem
    toggle-button-padding-x: 0.95rem
    card-grid-gap: 1.25rem
    card-media-height: 180px
    card-padding: 1.1rem
    card-gap: 0.8rem
    row-gap: 0.7rem
    chip-gap: 0.35rem
    chip-padding-y: 0.35rem
    chip-padding-x: 0.7rem
    button-padding-y: 0.7rem
    button-padding-x: 1rem
    dock-progress-height: 0.45rem
    dock-hover-zone: 1.1rem
    dock-open-height: 28rem
    dock-panel-gap: 0.85rem
    dock-panel-padding-y: 0.95rem
    dock-panel-padding-x: 1rem
    dock-panel-padding-bottom: 1rem
    dock-row-gap: 0.85rem
    dock-row-gap-inline: 1rem
    cluster-header-offset: 2.8rem
    cluster-header-gap: 0.5rem
    cluster-header-padding-y: 0.4rem
    cluster-header-padding-x: 0.65rem
    cluster-sequence-padding-bottom: 0.25rem
    empty-page-padding: 2rem
    empty-panel-padding: 2rem
    overlay-padding: 1.5rem
    overlay-panel-gap: 1rem
    overlay-panel-padding: 1.2rem
    overlay-header-gap: 1rem
    overlay-title-gap: 0.2rem
    overlay-section-gap: 0.65rem
    overlay-row-gap: 0.8rem
    overlay-key-padding-y: 0.35rem
    overlay-key-padding-x: 0.5rem
  components:
    card:
      padding: clamp(1rem, 2vw, 1.5rem)
      gap: 0.7rem
      title-gap: 0.65rem
      footer-gap: 0.9rem
    feature:
      gap: 0.7rem
      header-gap: 0.8rem
      headline-gap: 0.2rem
      list-gap: 0.45rem
    profile:
      gap: 1rem
      header-gap: 0.9rem
      meta-gap: 0.2rem
    stat:
      gap: 0.45rem
      trend-gap: 0.45rem
    comparison:
      gap: 0.8rem
      columns-gap: 1rem
    callout:
      padding: clamp(1rem, 2vw, 1.5rem)
      title-gap: 0.4rem
    list:
      gap: 0.7rem
      padding-start: 1.2rem
      numbered-padding-start: 1.4rem
    quote:
      padding: clamp(1rem, 2vw, 1.6rem)
      caption-gap: 1rem
    footnote:
      gap: 0.45rem
      padding-top: 0.75rem
    label:
      padding-y: 0.35rem
      padding-x: 0.8rem
    code:
      header-padding-y: 0.7rem
      header-padding-x: 1rem
      body-padding: 1rem
    timeline:
      gap: 1rem
      item-gap: 0.9rem
      item-padding: 1rem
      body-gap: 0.35rem
      event-gap: 0.35rem
      event-padding: 1rem
    annotation:
      focus-outline-offset: 0.18rem
      popover-offset: 0.65rem
      popover-padding-y: 0.7rem
      popover-padding-x: 0.85rem
    media:
      figure-gap: 0.75rem
      caption-gap: 0.75rem
    spectrum:
      gap: 0.8rem
      marker-gap: 0.35rem
      legend-gap: 1rem
    horizons:
      gap: 1rem
      columns-gap: 1rem
      column-padding: 0.9rem
      list-padding-start: 1.1rem
      list-gap: 0.35rem
    diagram:
      caption-gap: 0.75rem
  layouts:
    compact:
      padding: clamp(0.85rem, 1.4vw, 1.15rem)
      gap: clamp(0.5rem, 1vw, 0.85rem)
    timeline:
      gap: clamp(1.1rem, 2vw, 1.9rem)
      track-offset: 1.2rem
    comparison:
      arrow-gap: clamp(1.2rem, 2vw, 1.8rem)
    pyramid:
      gap: clamp(0.45rem, 0.8vw, 0.8rem)
sizing:
  components:
    shell:
      hero-max-width: 60rem
      lead-max-width: 48rem
      empty-panel-max-width: 34rem
      filter-min-width: 160px
      filter-max-width: 220px
      card-grid-min-width: 260px
      list-media-min-width: 220px
      list-media-max-width: 320px
      shortcut-panel-width: 32rem
      shortcut-panel-max-height: 42rem
      shortcut-key-min-width: 7.5rem
      shortcut-key-max-width: 10rem
      scrollbar: 6px
    feature:
      icon: 2.4rem
      icon-padding: 0.55rem
    profile:
      avatar: 4rem
    stat:
      trend-icon: 1rem
    timeline:
      marker: 2.25rem
      dot: 0.7rem
      icon: 1rem
      event-dot: 2rem
    annotation:
      popover-width: 20rem
      arrow: 0.8rem
    media:
      image-max-height: 420px
      iframe-min-height: 320px
    spectrum:
      figure-min-height: 15rem
      bar-min-height: 5rem
      dot: 0.9rem
      vertical-bar-width: 1.1rem
      vertical-min-height: 18rem
  layouts:
    title-left-accent-min-width: 220px
    section-header-accent-max-width: 14rem
    single-content-max-width: 78rem
    content-media-min-width: 280px
    sidebar-main-min-width: 220px
    gallery-item-min-width: 220px
    scattered-item-width: 320px
    timeline-item-min-width: 180px
    comparison-divider-min-width: 4rem
    comparison-divider-badge-size: 3rem
    pyramid-max-width: 52rem
    pyramid-top-width: 18rem
    pyramid-middle-width: 28rem
    pyramid-base-width: 38rem
radii:
  small: "0"
  medium: 0.8rem
  large: 1.2rem
  pill: 999px
  code: 10px
  scrollbar: 3px
  chrome:
    control: "0"
    card: "0"
    chip: "0"
    panel: "0"
    overlay: "0"
  components:
    card: "0"
    callout: "0"
    label: "0"
    code: 10px
    tooltip: "0"
    media: "0"
    avatar: 999px
    marker: 999px
    spectrum: 999px
  layouts:
    divider-badge: 999px
shadows:
  soft: 0 6px 14px rgba(0, 0, 0, 0.24)
  strong: 0 18px 40px rgba(0, 0, 0, 0.34)
  chrome:
    card: 0 24px 80px rgba(61, 43, 24, 0.08)
    panel: 0 -8px 24px rgba(0, 0, 0, 0.16)
    overlay: 0 28px 80px rgba(44, 30, 15, 0.18)
    float: 0 4px 12px rgba(0, 0, 0, 0.12)
  components:
    card: 0 4px 12px rgba(0, 0, 0, 0.12)
    code: 0 10px 24px rgba(0, 0, 0, 0.16)
    tooltip: 0 4px 12px rgba(0, 0, 0, 0.12)
borders:
  subtle: 1px solid rgba(255, 255, 255, 0.14)
  strong: 1px solid rgba(109, 140, 255, 0.3)
  chrome:
    control: 1px solid rgba(34, 33, 26, 0.14)
    card: 1px solid rgba(34, 33, 26, 0.14)
    chip: 1px solid rgba(34, 33, 26, 0.14)
    panel: 1px solid rgba(34, 33, 26, 0.14)
    overlay: 1px solid rgba(34, 33, 26, 0.18)
  components:
    card: 1px solid rgba(34, 33, 26, 0.14)
    callout: 1px solid rgba(34, 33, 26, 0.14)
    label: 1px solid rgba(34, 33, 26, 0.14)
    code: 1px solid rgba(34, 33, 26, 0.14)
    tooltip: 1px solid rgba(34, 33, 26, 0.28)
motion:
  fast: 180ms
  normal: 340ms
  slow: 700ms
  easing: cubic-bezier(0.22, 1, 0.36, 1)
  scene:
    duration: 440ms
    easing: cubic-bezier(0.55, 0, 0.2, 1)
  reveal:
    duration: 400ms
    easing: cubic-bezier(0.22, 1, 0.36, 1)
    delay-step: 85ms
    offset-y: 16
    initial-opacity: 0
  panel:
    duration: 300ms
    easing: ease-in-out
    offset-y: 0.8rem
  hover:
    duration: 180ms
    easing: ease-out
    scale: 1.015
    rise: -1px
  components:
    list:
      offset-y: 0.35rem
    timeline:
      offset-y: 0.4rem
name: Electric Studio
background:
  type: paper-shader
  presetRef: ember-truchet
fonts:
  heading:
    family: Manrope
    source: google
    weights:
      - 400
      - 700
      - 800
    styles:
      - normal
    display: swap
    fallbacks:
      - sans-serif
  body:
    family: Manrope
    source: google
    weights:
      - 400
      - 500
      - 700
    styles:
      - normal
    display: swap
    fallbacks:
      - sans-serif
  mono:
    family: JetBrains Mono
    source: google
    weights:
      - 400
      - 700
    styles:
      - normal
    display: swap
    fallbacks:
      - monospace
colors:
  background: "#0a0a0a"
  surface: "#111111"
  panel: "#0b1024"
  foreground: "#ffffff"
  muted: "#d7ddf7"
  border: rgba(255, 255, 255, 0.14)
  primary: "#6d8cff"
  secondary: "#ffffff"
  accent: "#7dd3fc"
  success: "#5bd3a6"
  warning: "#ffd166"
  error: "#ff8fa3"
  overlay: rgba(10, 10, 10, 0.88)
  background-rgb: 10, 10, 10
  foreground-rgb: 255, 255, 255
  chrome:
    page-glow: rgba(67, 97, 238, 0.18)
    page-top: "#111111"
    page-bottom: "#0a0a0a"
    surface: rgba(12, 18, 36, 0.76)
    surface-strong: rgba(12, 18, 36, 0.92)
    surface-active: rgba(25, 31, 58, 0.96)
    border: rgba(125, 211, 252, 0.18)
    text: "#ffffff"
    text-muted: "#d7ddf7"
    text-soft: "#b7c3e9"
    badge-bg: rgba(109, 140, 255, 0.12)
    badge-border: rgba(109, 140, 255, 0.2)
    badge-text: "#ffffff"
    accent-start: rgba(109, 140, 255, 0.2)
    accent-end: rgba(125, 211, 252, 0.16)
    thumbnail-start: rgba(10, 10, 10, 0.98)
    thumbnail-end: rgba(67, 97, 238, 0.5)
    thumbnail-text: "#ffffff"
    focus-ring: rgba(109, 140, 255, 0.3)
    noise-opacity: "0.026"
    noise-strength: "0.12"
  code:
    bg: "#0b1024"
    foreground: "#f4f7ff"
    header-bg: rgba(109, 140, 255, 0.08)
  scrollbar:
    thumb: "#6d8cff"
    thumb-muted: rgba(109, 140, 255, 0.72)
    track: transparent
    border: "#0a0a0a"
  progress:
    track: rgba(255, 255, 255, 0.12)
    start: "#6d8cff"
    end: "#7dd3fc"
  overlay-scrim: rgba(6, 8, 12, 0.58)
  diagram:
    series-1: "#6d8cff"
    series-2: "#7dd3fc"
    series-3: "#ffffff"
  error-surface: rgba(255, 143, 163, 0.08)
  error-border: rgba(255, 143, 163, 0.22)
  decor:
    active: "#6d8cff"
    inactive: rgba(255, 255, 255, 0.14)
    muted: "#d7ddf7"
    text: "#ffffff"
    panel: "#111111"
    line: "#6d8cff"
    rail-1: "#ffffff"
    rail-2: "#dbe6ff"
    rail-3: "#6d8cff"
    rail-4: "#7dd3fc"
    rail-5: "#94a3ff"
  pattern:
    overlay: linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, transparent 48%)
    grid: rgba(125, 211, 252, 0.06)
    scanline: transparent
    dot: transparent
    glow: rgba(109, 140, 255, 0.22)
    opacity: "0.58"
  split:
    left: "#ffffff"
    right: "#4361ee"
    band: rgba(125, 211, 252, 0.14)
  backgroundStops:
    default:
      - rgba(var(--color-background-rgb), 0.98)
      - rgba(109, 140, 255, 0.14)
      - rgba(125, 211, 252, 0.12)
